<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrandOS — дашборд селлера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c16;--bg2:#0e1120;--card:#131629;--card2:#181c33;--line:#242949;
  --text:#e9ebf8;--mut:#8a90b4;--blue:#4f8cff;--vio:#9b5cff;
  --red:#ff4d6d;--grn:#2ee59d;--amb:#ffb020;
  --grad:linear-gradient(135deg,#4f8cff,#9b5cff);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(155,92,255,.14),transparent),radial-gradient(800px 500px at 0% 0%,rgba(79,140,255,.12),transparent);
  background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:240px;flex:none;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:4px 10px 18px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-style:normal;box-shadow:0 0 18px rgba(124,108,255,.6)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--mut);font-weight:500;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav a.on{background:linear-gradient(90deg,rgba(79,140,255,.22),rgba(155,92,255,.12));color:#fff;box-shadow:inset 2px 0 0 var(--blue)}
.nav a .ic{width:20px;text-align:center}
.nav a .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.ai-btn{margin-top:12px;padding:12px;border-radius:12px;background:var(--grad);color:#fff;font-weight:600;box-shadow:0 0 22px rgba(124,108,255,.45)}
.ai-btn:hover{filter:brightness(1.1)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
/* main */
.main{flex:1;min-width:0;padding:20px 24px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.burger{display:none;width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:20px}
.hello h1{font-size:22px;font-weight:700}
.hello p{color:var(--mut);font-size:13px}
.search{flex:1;min-width:200px;max-width:420px;position:relative;margin-left:auto}
.search input{width:100%;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:0}
.search input:focus,.f-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
.sres{position:absolute;top:44px;left:0;right:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;z-index:30;max-height:340px;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.sres div{padding:9px 14px;cursor:pointer;display:flex;gap:8px;justify-content:space-between}
.sres div:hover{background:rgba(79,140,255,.12)}
.srcs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amb);box-shadow:0 0 8px var(--amb)}
.dot.ok{background:var(--grn);box-shadow:0 0 8px var(--grn)}
.dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
.sync{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px}
.sync button{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12px}
.sync button:hover{border-color:var(--blue)}
/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .more{margin-left:auto;font-size:12px;font-weight:500;color:var(--blue);cursor:pointer}
.demo{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--amb);border:1px solid rgba(255,176,32,.4);border-radius:6px;padding:1px 6px;background:rgba(255,176,32,.08)}
.kpi .lbl{color:var(--mut);font-size:12.5px}
.kpi .val{font-size:24px;font-weight:700;margin:4px 0}
.kpi .dl{font-size:12px;font-weight:600}
.up{color:var(--grn)}.dn{color:var(--red)}.warn{color:var(--amb)}.mut{color:var(--mut)}
.kpi{padding-bottom:54px}
.kpi svg{position:absolute;right:12px;bottom:10px;width:calc(100% - 24px);max-width:160px;height:38px;opacity:.95}
.bar{height:10px;background:#1c2140;border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;box-shadow:0 0 12px rgba(124,108,255,.7)}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.list>div{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border:0}
.list .g{flex:1;min-width:0}
.list .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.list .s{color:var(--mut);font-size:12px}
.btn{padding:8px 14px;border-radius:10px;font-weight:600;background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 0 16px rgba(124,108,255,.35)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{border-color:rgba(255,77,109,.5);color:var(--red)}
.tag{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;display:inline-block}
.t-red{background:rgba(255,77,109,.14);color:var(--red)}
.t-amb{background:rgba(255,176,32,.14);color:var(--amb)}
.t-grn{background:rgba(46,229,157,.13);color:var(--grn)}
.t-blu{background:rgba(79,140,255,.16);color:var(--blue)}
.t-vio{background:rgba(155,92,255,.18);color:#b88bff}
.t-gry{background:rgba(255,255,255,.07);color:var(--mut)}
.ins{padding:10px 12px;border-radius:12px;background:var(--card2);border-left:3px solid var(--blue);margin-bottom:10px}
.ins.h{border-color:var(--red)}.ins.m{border-color:var(--amb)}.ins.l{border-color:var(--grn)}
.ins b{display:block;font-weight:600;margin-bottom:2px}
.ins p{color:var(--mut);font-size:12.5px}
.ins .row{margin-top:8px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa button{padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:500;font-size:13px}
.qa button:hover{border-color:var(--vio);box-shadow:0 0 14px rgba(155,92,255,.25)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tw{overflow-x:auto}
.num{text-align:right;white-space:nowrap}
h2.pt{font-size:20px;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}
.bars i{flex:1;background:var(--grad);border-radius:4px 4px 0 0;min-height:3px;opacity:.9}
/* kanban */
.board{display:grid;grid-template-columns:repeat(var(--n,3),minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.colm{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.colm.over{border-color:var(--blue);box-shadow:0 0 18px rgba(79,140,255,.3)}
.colm h4{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-size:13px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;cursor:grab}
.kc:hover{border-color:#3a4272}
.kc.drag{opacity:.4}
.kc .tt{font-weight:600;margin-bottom:4px}
.kc .mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-top:7px}
.kc .mv{display:flex;gap:4px;margin-left:auto}
.kc .mv button{width:26px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--card2)}
.kc .mv button:hover{border-color:var(--blue)}
.av{width:22px;height:22px;border-radius:50%;background:var(--grad);display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.f-in{padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);outline:0}
.stat{padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
.stat b{font-size:17px}.stat.on{border-color:var(--blue);box-shadow:0 0 14px rgba(79,140,255,.3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:500}
.tabs button.on{background:var(--grad);color:#fff;border:0}
/* modal / drawer */
.modal{position:fixed;inset:0;background:rgba(3,4,10,.72);z-index:100;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 0 50px rgba(124,108,255,.25)}
.mbox h3{font-size:17px;margin-bottom:14px}
.fld{margin-bottom:12px}.fld label{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
.fld .f-in{width:100%}
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100%;background:var(--bg2);border-left:1px solid var(--line);z-index:90;display:flex;flex-direction:column;transform:translateX(105%);transition:.25s;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-weight:600}
.dh button{margin-left:auto;font-size:20px;color:var(--mut)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;background:var(--card2);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.chips button{padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--mut)}
.chips button:hover{color:var(--text);border-color:var(--vio)}
.dfoot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.dfoot input{flex:1;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);outline:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--blue);padding:10px 18px;border-radius:12px;z-index:200;box-shadow:0 0 24px rgba(79,140,255,.4)}
.integ{display:flex;flex-direction:column;gap:8px}
.integ .logo2{width:38px;height:38px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-weight:700}
.dec .steps{margin:8px 0 8px 18px;color:var(--mut)}
.dec .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.empty{color:var(--mut);text-align:center;padding:30px}
@media(max-width:1180px){.cols{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.25s;width:270px}
  .side.open{transform:none}
  .scrim.show{display:block}
  .burger{display:block}
  .main{padding:14px 14px 60px}
  .g4,.g2,.g3{grid-template-columns:1fr}
  .search{max-width:none;order:5;flex-basis:100%;margin-left:0}
  .board{grid-template-columns:repeat(var(--n,3),84vw)}
  .hello h1{font-size:19px}
}
</style>
</head>

<div class="app">
  <aside class="side" id="side">

    <nav class="nav" id="nav"></nav>

  <div class="scrim" id="scrim"></div>

DATA.forecast = (() => {
  const out = []; let b = 1500000; const ev = {};
  DATA.cashEvents.forEach(e => ev[e.i] = -e.amt);
  for (let i = -10; i <= 30; i++) {
    b += 65000 + Math.sin(i * 1.3) * 18000 + (ev[i] || 0);
    const sp = i > 0 ? 60000 * Math.sqrt(i) : 0;
    out.push({ i, bal: b, lo: b - sp, hi: b + sp });
  }
  return out;
})();

function planInfo() {

  const s = DATA.settings, fact = s.avgDaily * day, fc = s.avgDaily * dim;
  return { day, dim, fact, fc, plan: s.monthPlan, p: Math.min(100, fact / s.monthPlan * 100), fcp: fc / s.monthPlan * 100 };
}

function spark(arr, color) {
  const w = 90, h = 40, mn = Math.min(...arr), mx = Math.max(...arr), r = mx - mn || 1;
  const pts = arr.map((v, i) => [i / (arr.length - 1) * w, h - 4 - (v - mn) / r * (h - 8)]);
  const line = pts.map(p => p.join(',')).join(' ');
  const id = 'g' + uid();
  return `<svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".4"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${line} ${w},${h}" fill="url(#${id})"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px ${color})"/></svg>`;
}
function forecastChart() {
  const F = DATA.forecast, W = 720, H = 270, L = 52, R = 12, T = 14, B = 28;
  const all = F.flatMap(p => [p.lo, p.hi]); const mn = Math.min(...all, 0) - 100000, mx = Math.max(...all) + 100000;
  const x = i => L + (i + 10) / 40 * (W - L - R), y = v => T + (1 - (v - mn) / (mx - mn)) * (H - T - B);
  const fact = F.filter(p => p.i <= 0), fc = F.filter(p => p.i >= 0);
  const poly = a => a.map(p => x(p.i).toFixed(1) + ',' + y(p.bal).toFixed(1)).join(' ');
  const cor = fc.map(p => x(p.i) + ',' + y(p.hi)).join(' ') + ' ' + fc.slice().reverse().map(p => x(p.i) + ',' + y(p.lo)).join(' ');
  let grid = '';
  for (let k = 0; k <= 4; k++) { const v = mn + (mx - mn) * k / 4; grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#242949" stroke-dasharray="3 4"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" fill="#8a90b4" font-size="10">${(v / 1e6).toFixed(1)}М</text>`; }
  let xl = '';
  [-10, 0, 10, 20, 30].forEach(i => xl += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" fill="#8a90b4" font-size="10">${i === 0 ? 'сегодня' : fshort(addD(i))}</text>`);
  const g = DATA.gap;
  const mark = g ? `<line x1="${x(g.i)}" x2="${x(g.i)}" y1="${T}" y2="${H - B}" stroke="#ff4d6d" stroke-dasharray="4 3"/><circle cx="${x(g.i)}" cy="${y(g.bal)}" r="6" fill="#ff4d6d" style="filter:drop-shadow(0 0 6px #ff4d6d)"/><text x="${Math.min(x(g.i) + 8, W - 130)}" y="${T + 12}" fill="#ff4d6d" font-size="11" font-weight="600">Кассовый разрыв ${fshort(addD(g.i))}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="fa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8cff" stop-opacity=".35"/><stop offset="1" stop-color="#4f8cff" stop-opacity="0"/></linearGradient></defs>${grid}${xl}
  <line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#ff4d6d" stroke-opacity=".5"/>
  <polygon points="${cor}" fill="#9b5cff" fill-opacity=".16"/>
  <polygon points="${x(-10)},${y(mn)} ${poly(fact)} ${x(0)},${y(mn)}" fill="url(#fa)"/>
  <polyline points="${poly(fact)}" fill="none" stroke="#4f8cff" stroke-width="2.5" style="filter:drop-shadow(0 0 4px #4f8cff)"/>
  <polyline points="${poly(fc)}" fill="none" stroke="#9b5cff" stroke-width="2.5" stroke-dasharray="6 5" style="filter:drop-shadow(0 0 4px #9b5cff)"/>${mark}</svg>
  <div class="row mut" style="font-size:12px;gap:16px;flex-wrap:wrap;margin-top:6px"><span><b style="color:#4f8cff">━</b> факт</span><span><b style="color:#9b5cff">╍</b> прогноз</span><span><b style="color:#9b5cff;opacity:.4">▮</b> коридор</span><span><b style="color:#ff4d6d">●</b> кассовый разрыв</span></div>`;
}

function buildDecisions() {
  const out = [], S = SKUS(), C = CAMPS(), set = DATA.settings, pi = planInfo();
  if (DATA.gap) {
    const g = DATA.gap, need = Math.abs(Math.min(...DATA.forecast.filter(p => p.i > 0).map(p => p.bal)));

  }
  S.filter(s => s.days < set.minDaysStock).sort((a, b) => a.days - b.days).forEach(s => {
    const qty = Math.round(s.daily * 45 / 10) * 10;
    out.push({ id: 'stock-' + s.art, dir: 'Склад', urg: s.days < 7 ? 'high' : 'med', title: `Дозаказать арт. ${s.art} — ${qty} шт.`, sit: `«${s.name}»: остаток ${s.stock} шт., продаём ≈ ${s.daily.toFixed(1)} шт./день — хватит на ${Math.floor(s.days)} дн. (порог ${set.minDaysStock}). Выручка за 28 дней ${mln(s.rev)}, тренд за 7 дней ${s.trend > 0 ? '+' : ''}${s.trend}%.`, why: 'Если товар закончится, потеряем продажи и позиции в выдаче. Срок производства и доставки — 3+ недели.', steps: [`Запросить у поставщика счёт на ${qty} шт.`, 'Согласовать оплату и дату отгрузки', 'Создать поставку на склад МП'], effect: Math.round(s.profit * 0.8), due: isoD(3), conf: 75, metric: `Остаток арт. ${s.art} ≥ ${set.minDaysStock} дней` });
  });
  C.filter(c => c.drr > set.maxDrr).sort((a, b) => b.drr - a.drr).forEach(c => {
    const save_ = Math.round(c.spend * (1 - set.maxDrr / c.drr));

  });
  S.filter(s => s.profit < 0).forEach(s => out.push({ id: 'neg-' + s.art, dir: 'Цены', urg: 'high', title: `Поднять цену или убрать арт. ${s.art} из рекламы`, sit: `«${s.name}» в минус: прибыль ${rub(s.profit)} за 28 дней (маржа ${pct(s.margin)}). Себестоимость ${pct(s.cogs * 100, 0)}, комиссии и логистика ${pct(s.fees * 100, 0)}, реклама ${mln(s.ads)} (ДРР ${pct(s.drr)}).`, why: 'Продажи этого артикула уменьшают общую прибыль.', steps: ['Пересчитать цену с учётом комиссий и рекламы', 'Поднять цену на 8–10% и отключить рекламу', 'Через 2 недели оценить результат'], effect: Math.round(Math.abs(s.profit)), due: isoD(5), conf: 65, metric: `Маржа арт. ${s.art} > 0%` }));
  if (pi.fc < pi.plan * 0.97) out.push({ id: 'plan', dir: 'Продажи', urg: 'med', title: 'Догнать план месяца', sit: `Факт ${mln(pi.fact)} (${pct(pi.p, 0)} плана). Прогноз на конец месяца ${mln(pi.fc)} — не хватает ${mln(pi.plan - pi.fc)}.`, why: 'При текущем темпе план не выполнится. Быстрее всего помогает акция на ходовых артикулах и рост оптовых сделок.', steps: ['Запустить акцию на топ-3 артикула', 'Дожать сделки в стадии «Счёт выставлен» в CRM', 'Проверить остатки топ-артикулов перед акцией'], effect: Math.round(pi.plan - pi.fc), due: isoD(7), conf: 55, metric: 'Прогноз выручки на конец месяца ≥ плана' });
  const toPay = docs.filter(d => d.type === 'Счёт' && d.status !== 'Обработан');

  return out;
}
function allDecisions() {
  return buildDecisions().map(d => ({ ...d, st: decState[d.id] || { status: 'new' } }))
    .concat([]).map(d => {
      if (d.st.status === 'postponed' && d.st.until && d.st.until <= isoD(0)) d.st = { status: 'new' };
      if (d.st.status === 'progress') {
        const ts = tasks.filter(t => t.decision === d.id);
        if (ts.length && ts.every(t => t.status === 'done')) { d.st = { ...d.st, status: 'done' }; decState[d.id] = d.st; save('decisions', decState); }
      }
      return d;
    });
}

/* ---- Центр решений ---- */
const URG = { high: ['Срочно', 't-red'], med: ['Важно', 't-amb'], low: ['Можно позже', 't-grn'] };
function pDecisions() {
  const all = allDecisions(), tabs = [['new', 'Новые'], ['progress', 'В работе'], ['postponed', 'Отложены'], ['done', 'Выполнены'], ['rejected', 'Отклонены']];
  const list = all.filter(d => d.st.status === decTab);
  const total = all.filter(d => d.st.status === 'new').reduce((a, d) => a + d.effect, 0);
  return `<h2 class="pt">Центр решений</h2><p class="sub">Решения, которые нужно принять сегодня. Сейчас работают встроенные правила; с ключом Claude API список составит ИИ. ${demoTag}</p>
  <div class="filters"><div class="stat">Потенциальный эффект новых <b class="up">${mln(total)}/мес</b></div><button class="btn pri" data-act="recalc" style="margin-left:auto">↻ Пересчитать сейчас</button></div>
  <div class="tabs">${tabs.map(([k, n]) => `<button class="${decTab === k ? 'on' : ''}" data-act="dtab" data-t="${k}">${n} (${all.filter(d => d.st.status === k).length})</button>`).join('')}</div>
  <div class="grid">${list.map(d => `<div class="card dec"><h3><span class="tag ${URG[d.urg][1]}">${URG[d.urg][0]}</span><span class="tag t-gry">${d.dir}</span></h3>
    <b style="font-size:16px">${esc(d.title)}</b>
    <p style="margin-top:6px">${esc(d.sit)}</p><p class="mut" style="margin-top:6px"><b>Почему:</b> ${esc(d.why)}</p>
    <ol class="steps">${d.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <div class="meta"><span class="tag t-grn">Эффект: ${d.effect ? '+' + mln(d.effect) + '/мес' : 'снижение рисков'}</span><span class="tag t-blu">Срок: ${fdate(d.due)}</span><span class="tag t-gry">Уверенность ${d.conf}%</span></div>
    <p class="mut" style="font-size:12px">Метрика проверки: ${esc(d.metric)}</p>
    ${d.st.status === 'progress' ? `<div class="bar" style="margin-top:10px"><i style="width:${decProgress(d)}%"></i></div><p class="mut" style="font-size:12px;margin-top:4px">Выполнено ${decProgress(d)}% (по задачам)</p>` : ''}
    ${d.st.status === 'rejected' ? `<p class="dn" style="margin-top:8px">Причина отказа: ${esc(d.st.reason || '—')}</p>` : ''}
    ${d.st.status === 'postponed' ? `<p class="warn" style="margin-top:8px">Вернётся ${fdate(d.st.until)}</p>` : ''}
    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      ${d.st.status === 'new' || d.st.status === 'postponed' ? `<button class="btn pri sm" data-act="dAccept" data-id="${d.id}">Принять</button><button class="btn sm" data-act="dPost" data-id="${d.id}">Отложить на 3 дня</button><button class="btn sm danger" data-act="dRej" data-id="${d.id}">Отклонить</button>` : ''}
      ${d.st.status === 'progress' ? `<button class="btn sm" data-go="tasks">Задачи →</button>` : ''}
      ${d.st.status === 'rejected' || d.st.status === 'done' ? `<button class="btn sm" data-act="dRestore" data-id="${d.id}">Вернуть в новые</button>` : ''}
      <button class="btn sm" data-act="dAsk" data-id="${d.id}">✨ Обсудить с ИИ</button></div></div>`).join('') || '<div class="card empty">В этой вкладке пока пусто</div>'}</div>`;
}

/* ---- Аналитика / остальные разделы на тех же данных ---- */
const skuTable = (rows) => `<div class="card tw"><table class="tbl"><thead><tr><th>Артикул</th><th>Канал</th><th class="num">Выручка 28д</th><th class="num">Тренд 7д</th><th class="num">Продано</th><th class="num">Остаток</th><th class="num">Хватит на</th><th class="num">Реклама</th><th class="num">ДРР</th><th class="num">Прибыль</th><th class="num">Маржа</th></tr></thead><tbody>
${rows.map(s => `<tr><td><b>${s.art}</b><div class="mut" style="font-size:12px">${s.name}</div></td><td>${s.ch}</td><td class="num">${rub(s.rev)}</td><td class="num ${s.trend >= 0 ? 'up' : 'dn'}">${s.trend >= 0 ? '▲' : '▼'} ${pct(Math.abs(s.trend))}</td><td class="num">${s.sold}</td><td class="num">${s.stock}</td>

const campTable = rows => `<div class="card tw"><table class="tbl"><thead><tr><th>Кампания</th><th class="num">Расход</th><th class="num">Показы</th><th class="num">CTR</th><th class="num">Заказы</th><th class="num">Цена заказа</th><th class="num">ДРР месяц</th><th class="num">ДРР неделя</th></tr></thead><tbody>
${rows.map(c => `<tr><td>${c.name}</td><td class="num">${rub(c.spend)}</td><td class="num">${c.impr.toLocaleString('ru-RU')}</td><td class="num">${c.ctr}%</td><td class="num">${c.orders}</td><td class="num">${rub(c.cpo)}</td><td class="num ${c.drr > DATA.settings.maxDrr ? 'dn' : 'up'}">${pct(c.drr)}</td><td class="num ${c.drrWeek > DATA.settings.maxDrr ? 'dn' : 'up'}">${pct(c.drrWeek)}</td></tr>`).join('')}</tbody></table></div>`;
const head = (t, s) => `<h2 class="pt">${t} ${demoTag}</h2><p class="sub">${s}</p>`;
const pAnalytics = () => head('Аналитика', 'Артикулы и рекламные кампании на тех же данных, что и Центр решений.') + '<h3 style="margin:8px 0">Артикулы</h3>' + skuTable(SKUS()) + '<h3 style="margin:18px 0 8px">Рекламные кампании</h3>' + campTable(CAMPS());
const pAds = () => { const c = CAMPS(), sp = c.reduce((a, x) => a + x.spend, 0), rv = c.reduce((a, x) => a + x.rev, 0); return head('Реклама', `Расход ${mln(sp)} · общий ДРР ${pct(sp / rv * 100)} · порог ${DATA.settings.maxDrr}%`) + campTable(c); };
const pStock = () => head('Склад', 'Остатки и сколько дней хватит каждого артикула.') + skuTable(SKUS().sort((a, b) => a.days - b.days));
function pFinance() {
  const pi = planInfo(), rev = pi.fact, prof = rev * DATA.settings.profitRate, ev = DATA.cashEvents;
  return head('Финансы', 'Прибыль, деньги и кассовый прогноз.') + `<div class="grid g4" style="margin-bottom:16px">${kcard('Выручка', mln(rev), DATA.kpiDelta.revenue, DATA.kpiSpark.revenue, '#4f8cff')}${kcard('Чистая прибыль', mln(prof), DATA.kpiDelta.profit, DATA.kpiSpark.profit, '#9b5cff')}${kcard('Маржа', pct(DATA.settings.margin), DATA.kpiDelta.margin, DATA.kpiSpark.margin, '#2ee59d')}${kcard('Деньги на счетах', mln(cashNow()), DATA.kpiDelta.cash, DATA.kpiSpark.cash, '#4f8cff')}</div>
  <div class="grid g2"><div class="card"><h3>Прогноз денег на 30 дней</h3>${forecastChart()}</div><div class="card"><h3>Крупные платежи</h3><div class="list">${ev.map(e => `<div><div class="g"><div class="t">${e.name}</div><div class="s">${fshort(addD(e.i))}</div></div><b>−${rub(e.amt)}</b></div>`).join('')}</div></div></div>`;
}
function pSales() { const S = DATA.sales; return head('Продажи', 'Динамика заказов за 14 дней.') + `<div class="grid g3" style="margin-bottom:16px"><div class="card kpi"><div class="lbl">Заказов</div><div class="val">${S.orders}</div><div class="dl up">▲ ${S.ordersDelta}%</div></div><div class="card kpi"><div class="lbl">Средний чек</div><div class="val">${rub(S.avgCheck)}</div></div><div class="card kpi"><div class="lbl">Возвраты</div><div class="val">${S.returns}%</div></div></div><div class="card"><h3>Заказы по дням</h3><div class="bars" style="height:180px">${S.byDay.map(v => `<i style="height:${v / 0.7}%" title="${v}"></i>`).join('')}</div></div>`; }
const pMp = () => head('Маркетплейсы', 'Сравнение каналов продаж.') + `<div class="grid g3">${DATA.channels.map(c => `<div class="card"><h3><span class="dot" style="background:${c.color}"></span>${c.name}</h3><p class="mut">Доля выручки</p><div class="val" style="font-size:22px;font-weight:700">${c.share}%</div><div class="bar" style="margin:8px 0"><i style="width:${c.share}%;background:${c.color}"></i></div><div class="row sp"><span class="mut">Маржа</span><b>${pct(c.margin)}</b></div><div class="row sp"><span class="mut">ДРР</span><b class="${c.drr > DATA.settings.maxDrr ? 'dn' : 'up'}">${pct(c.drr)}</b></div></div>`).join('')}</div>`;
const pSupplies = () => head('Поставки', 'Что едет на склады маркетплейсов.') + `<div class="card"><div class="list">${DATA.supplies.map(s => `<div><div class="g"><div class="t">${s.name}</div><div class="s">${s.qty} шт. · ${s.eta ? 'ожидается через ' + s.eta + ' дн.' : 'сегодня'}</div></div><span class="tag t-blu">${s.status}</span></div>`).join('')}</div></div>`;
const pTaxes = () => head('Налоги', 'График обязательных платежей (из settings.json на этапе 2).') + `<div class="card"><div class="list">${DATA.taxes.map(t => `<div><div class="g"><div class="t">${t.name}</div><div class="s">${fdate(isoD(t.in))} · через ${t.in} дн.</div></div><b>${rub(t.amount)}</b></div>`).join('')}</div><p class="row sp" style="margin-top:12px"><span class="mut">Итого ближайшие платежи</span><b>${rub(DATA.taxes.reduce((a, t) => a + t.amount, 0))}</b></p></div>`;

const PAGES = { home: pHome, decisions: pDecisions, analytics: pAnalytics, finance: pFinance, sales: pSales, mp: pMp, ads: pAds, crm: pCrm, stock: pStock, supplies: pSupplies, taxes: pTaxes, docs: pDocs, integ: pInteg, tasks: pTasks };
function render() { renderNav(); renderHead(); $('#view').innerHTML = PAGES[page](); }

/* ===================== модальные окна ===================== */
function modal(title, body, onSave, onDel) {
  $('#overlay').innerHTML = `<div class="modal" id="mod"><div class="mbox"><h3>${title}</h3>${body}<div class="row" style="margin-top:6px">${onDel ? '<button class="btn danger" id="m_del">Удалить</button>' : ''}<span style="flex:1"></span><button class="btn" id="m_cancel">Отмена</button>${onSave ? '<button class="btn pri" id="m_ok">Сохранить</button>' : ''}</div></div></div>`;
  const close = () => $('#overlay').innerHTML = '';
  $('#m_cancel').onclick = close; $('#mod').addEventListener('mousedown', e => { if (e.target.id === 'mod') close(); });
  if (onSave) $('#m_ok').onclick = () => { if (onSave() !== false) close(); };
  if (onDel) $('#m_del').onclick = () => { onDel(); close(); };
  const f = $('#mod input,#mod textarea'); if (f) f.focus();
}
const closeModal = () => $('#overlay').innerHTML = '';

/* ===================== ИИ-ассистент (демо-правила по данным) ===================== */
const aiChips = ['Как выручка?', 'Что со складом?', 'Какие задачи горят?', 'Где реклама неэффективна?', 'Что с деньгами?'];
function aiReply(q) {
  q = q.toLowerCase(); const pi = planInfo(), S = SKUS(), C = CAMPS(), tc = taskCounts(), set = DATA.settings;
  const note = '\n\n(Данные демонстрационные — реальные подключаются через «Интеграции».)';
  if (/выруч|план|продаж/.test(q)) return `Выручка за месяц: ${mln(pi.fact)} — ${pct(pi.p, 0)} плана ${mln(pi.plan)}. Прогноз на конец месяца: ${mln(pi.fc)}${pi.fc < pi.plan ? ', до плана не хватает ' + mln(pi.plan - pi.fc) : ''}. Рост к прошлому месяцу: +${DATA.kpiDelta.revenue}%.` + note;
  if (/прибыл|марж/.test(q)) return `Чистая прибыль: ${mln(pi.fact * set.profitRate)}, маржа ${pct(set.margin)}. По каналам: ` + DATA.channels.map(c => `${c.name} ${pct(c.margin)}`).join(', ') + '.' + (S.some(s => s.profit < 0) ? `\nВ минус: ${S.filter(s => s.profit < 0).map(s => s.art).join(', ')}.` : '') + note;
  if (/денег|деньг|касс|счет|счёт|прогноз/.test(q)) return `На счетах ≈ ${mln(cashNow())}. ` + (DATA.gap ? `Прогноз показывает кассовый разрыв ${fshort(addD(DATA.gap.i))} (баланс ${mln(DATA.gap.bal)}). Решение — в «Центре решений».` : 'Кассовых разрывов на 30 дней нет.') + note;
  if (/склад|остат|артикул|дозаказ/.test(q)) { const l = S.filter(s => s.days < set.minDaysStock); return l.length ? 'Заканчиваются: ' + l.map(s => `${s.art} (${Math.floor(s.days)} дн., остаток ${s.stock})`).join('; ') + '.' + note : 'Все артикулы обеспечены более чем на ' + set.minDaysStock + ' дней.' + note; }
  if (/реклам|дрр|кампани/.test(q)) { const b = C.filter(c => c.drr > set.maxDrr); return b.length ? `Выше порога ДРР ${set.maxDrr}%: ` + b.map(c => `«${c.name}» ${pct(c.drr)}`).join('; ') + '.' + note : 'Все кампании в пределах порога ДРР.' + note; }
  if (/задач|горит|просроч/.test(q)) return `Открытых задач: ${tc.open}, на сегодня: ${tc.today}, просрочено: ${tc.over}.` + (tc.over ? '\nПросрочены: ' + tasks.filter(t => t.status !== 'done' && t.due < isoD(0)).map(t => t.title).join('; ') + '.' : '');
  if (/сделк|crm|воронк|клиент/.test(q)) { const sum = deals.filter(d => d.stage !== 'Оплачено').reduce((a, d) => a + d.sum, 0); return `В CRM ${deals.length} сделок, в воронке ${mln(sum)}. Оплачено: ${deals.filter(d => d.stage === 'Оплачено').length}.`; }
  if (/документ|подпис|акт/.test(q)) { const w = docs.filter(d => d.status === 'Ждёт подписи'); return `Документов: ${docs.length}. Ждут подписи: ${w.length}${w.length ? ' — ' + w.map(d => d.name).join('; ') : ''}.`; }
  return 'Я отвечаю по данным дашборда: выручка и план, прибыль, деньги, склад, реклама, задачи, сделки, документы. Если данных нет — так и скажу, выдумывать цифры не буду.';
}
function aiSay(text, me) { const m = document.createElement('div'); m.className = 'msg' + (me ? ' me' : ''); m.textContent = text; $('#msgs').appendChild(m); $('#msgs').scrollTop = 1e9; }
function aiOpen(q) {
  $('#drawer').classList.add('open');
  if (!$('#msgs').children.length) { aiSay('Здравствуйте! Я отвечаю по данным вашего бизнеса. Что интересует?'); $('#chips').innerHTML = aiChips.map(c => `<button data-chip="${c}">${c}</button>`).join(''); }
  if (q) { aiSay(q, true); setTimeout(() => aiSay(aiReply(q)), 250); }
}

/* ===================== события ===================== */
document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]'); if (goEl) { go(goEl.dataset.go); return; }
  const chip = e.target.closest('[data-chip]'); if (chip) { aiOpen(chip.dataset.chip); return; }
  const el = e.target.closest('[data-act]'); if (!el) { if (!e.target.closest('.search')) $('#sres').hidden = true; return; }
  const id = el.dataset.id, a = el.dataset.act;
  switch (a) {
    case 'ai': aiOpen(); break;
    case 'aiclose': $('#drawer').classList.remove('open'); break;
    case 'sync': lastSync = new Date().toISOString(); save('sync', lastSync); renderHead(); toast(DATA.demo ? 'Демо-данные: подключите источники в «Интеграциях»' : 'Данные обновлены'); break;
    case 'newTask': taskModal(); break;
    case 'editTask': taskModal(id); break;
    case 'newDeal': dealModal(); break;
    case 'editDeal': dealModal(id); break;
    case 'quick': fTasks.quick = fTasks.quick === el.dataset.q ? '' : el.dataset.q; render(); break;
    case 'mv': { const t = tasks.find(x => x.id === id), i = TCOL.findIndex(c => c[0] === t.status) + +el.dataset.d; t.status = TCOL[i][0]; saveAll(); render(); break; }
    case 'mvDeal': { const d = deals.find(x => x.id === id), i = DATA.stages.indexOf(d.stage) + +el.dataset.d; d.stage = DATA.stages[i]; saveAll(); render(); break; }
    case 'upload': $('#file').click(); break;
    case 'docInfo': { const d = docs.find(x => x.id === id); modal(esc(d.name), `<div class="list"><div><div class="g">Источник</div><b>${d.source}</b></div><div><div class="g">Тип</div><b>${esc(d.type)}</b></div><div><div class="g">Контрагент</div><b>${esc(d.cp)}</b></div><div><div class="g">Сумма</div><b>${d.sum ? rub(d.sum) : '—'}</b></div><div><div class="g">Дата</div><b>${fdate(d.date)}</b></div><div><div class="g">Статус</div>${docTag(d.status)}</div></div>`); break; }
    case 'connect': { const s = DATA.sources.find(x => x.id === id); modal('Подключение: ' + s.name, `<p><b>Где взять ключ:</b> ${s.how}.</p><p class="mut" style="margin-top:10px">Ключи вписываются только в файл <code>.env</code> на сервере и никогда не попадают в браузер. Серверная часть подключается на этапе 2 — пока этот источник работает в демо-режиме.</p>`); break; }
    case 'dtab': decTab = el.dataset.t; render(); break;
    case 'recalc': render(); toast('Решения пересчитаны по текущим данным'); break;
    case 'dAccept': {
      const d = allDecisions().find(x => x.id === id);
      d.steps.forEach(s => tasks.push({ id: uid(), title: s, desc: d.title, status: 'todo', prio: d.urg === 'high' ? 'high' : d.urg === 'med' ? 'med' : 'low', due: d.due, who: DATA.team[0], ai: true, doc: '', decision: d.id }));
      decState[id] = { status: 'progress' }; saveAll(); decTab = 'progress'; render(); toast(`Создано задач: ${d.steps.length}`); break;
    }
    case 'dPost': decState[id] = { status: 'postponed', until: isoD(3) }; saveAll(); render(); toast('Отложено на 3 дня'); break;
    case 'dRej': modal('Отклонить решение', `<div class="fld"><label>Причина (ИИ учтёт её в следующий раз)</label><textarea class="f-in" id="m_reason" rows="3"></textarea></div>`, () => { decState[id] = { status: 'rejected', reason: $('#m_reason').value.trim() }; saveAll(); render(); }); break;
    case 'dRestore': decState[id] = { status: 'new' }; saveAll(); render(); break;
    case 'dAsk': { const d = allDecisions().find(x => x.id === id); aiOpen(); aiSay(`Обсудим: «${d.title}»`, true); aiSay(`${d.sit}\n\nПочему: ${d.why}\n\nУверенность ${d.conf}%. Проверять по метрике: ${d.metric}.`); break; }
  }
});
document.addEventListener('change', e => {
  const f = e.target.dataset.f; if (!f) return;
  if (f === 'who' || f === 'prio') fTasks[f] = e.target.value;
  if (f === 'ai') fTasks.ai = e.target.checked;
  if (f === 'dsrc') fDocs.src = e.target.value;
  if (f === 'dst') docs.find(d => d.id === e.target.dataset.id).status = e.target.value, saveAll();
  render();
});
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  docs.push({ id: 'd' + uid(), name: f.name, source: 'Загрузка', type: 'Документ', cp: '—', sum: 0, date: isoD(0), status: 'Новый' });
  saveAll(); e.target.value = ''; if (page !== 'docs') go('docs'); else render(); toast('Файл добавлен в документы');
});
/* drag & drop (десктоп) */
let dragId = null, dragBoard = null;
document.addEventListener('dragstart', e => { const k = e.target.closest('.kc'); if (!k) return; dragId = k.dataset.id; dragBoard = k.dataset.board; k.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragend', () => { document.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
document.addEventListener('dragover', e => { const c = e.target.closest('.colm'); if (c && c.dataset.board === dragBoard) { e.preventDefault(); document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); c.classList.add('over'); } });
document.addEventListener('drop', e => {
  const c = e.target.closest('.colm'); if (!c || c.dataset.board !== dragBoard) return; e.preventDefault();
  if (dragBoard === 'tasks') tasks.find(t => t.id === dragId).status = c.dataset.col; else deals.find(d => d.id === dragId).stage = c.dataset.col;
  saveAll(); render();
});
/* поиск */
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), box = $('#sres'); if (q.length < 2) { box.hidden = true; return; }
  const r = [];
  tasks.filter(t => t.title.toLowerCase().includes(q)).forEach(t => r.push(['tasks', 'Задача', t.title]));
  deals.filter(d => (d.title + d.client).toLowerCase().includes(q)).forEach(d => r.push(['crm', 'Сделка', d.title + ' · ' + d.client]));
  docs.filter(d => (d.name + d.cp).toLowerCase().includes(q)).forEach(d => r.push(['docs', 'Документ', d.name]));
  DATA.skus.filter(s => (s.art + s.name).toLowerCase().includes(q)).forEach(s => r.push(['analytics', 'Артикул', s.art + ' · ' + s.name]));
  box.hidden = false; box.innerHTML = r.slice(0, 10).map(x => `<div data-go="${x[0]}" onclick="$('#sres').hidden=true;$('#q').value=''"><span>${esc(x[2])}</span><span class="mut">${x[1]}</span></div>`).join('') || '<div class="mut">Ничего не найдено</div>';
});
$('#aiform').addEventListener('submit', e => { e.preventDefault(); const v = $('#aiq').value.trim(); if (v) { $('#aiq').value = ''; aiOpen(v); } });
$('#burger').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#drawer').classList.remove('open'); } });
go(location.hash.slice(1) || 'home');
</script>
</body>
</html>
