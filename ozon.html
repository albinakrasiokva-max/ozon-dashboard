    const soon = M.stock.filter(s => s.stock.status === 'crit');
    out.push(soon.length
      ? { cls: 'neg', html: `<b>${nTov(soon.length)}</b> ${plural(soon.length, 'закончится', 'закончатся', 'закончатся')} меньше чем через ${set.stockCrit} дн.: ${soon.slice(0, 3).map(s => '«' + esc(short(s.name)) + '»').join(', ')}${soon.length > 3 ? ' и другие' : ''}.` }
      : { cls: 'pos', html: `Ни один товар не закончится в ближайшие ${set.stockCrit} дн.` });
  } else out.push({ cls: '', html: '<span class="muted">Прогноз обнуления остатков появится после загрузки отчёта «Управление остатками».</span>' });
  if (M.have.ads && T.drr != null) {
    const d = T.drr * 100;
    const where = d > set.drrHigh ? `<b>выше</b> ориентира ${set.drrLow}–${set.drrHigh}%: реклама съедает заметную часть выручки` : d < set.drrLow ? `<b>ниже</b> ориентира ${set.drrLow}–${set.drrHigh}%: есть запас, чтобы тратить на продвижение больше` : `в пределах ориентира ${set.drrLow}–${set.drrHigh}%`;
    out.push({ cls: d > set.drrHigh ? 'neg' : d < set.drrLow ? 'acc' : 'pos', html: `ДРР каталога ${pct(T.drr)} — ${where}.` });
  } else out.push({ cls: '', html: '<span class="muted">ДРР появится после загрузки отчёта «Аналитика продвижения» за этот период.</span>' });
  const G = M.growth;
  if (G.signals.length) out.push({ cls: 'acc', html: `Найдено <b>${G.signals.length}</b> ${plural(G.signals.length, 'точка', 'точки', 'точек')} роста в воронке${G.total > 0 ? ` — ориентировочно ${rub(G.total)} дополнительной прибыли за такой же период` : ''}. Подробности на вкладке «Реклама и воронка».` });
  else if (!G.enough && M.have.ads) out.push({ cls: '', html: '<span class="muted">Для поиска точек роста нужно минимум 3 товара с рекламными показами.</span>' });
  const cand = M.skus.filter(s => s.abcRevenue === 'C' && s.profitKnown && s.profit < 0);
  const cRev = M.skus.filter(s => s.abcRevenue === 'C');
  if (cRev.length && !cRev.some(s => s.profitKnown)) out.push({ cls: 'warn', html: `В группе C по выручке ${nTov(cRev.length)}, но прибыль по ним ещё не посчитана — нельзя сказать, какие из них стоит выводить из ассортимента.` });
  else out.push(cand.length
    ? { cls: 'warn', html: `<b>${nTov(cand.length)}</b> одновременно в группе C по выручке и в убытке — ${plural(cand.length, 'кандидат', 'кандидаты', 'кандидаты')} на вывод из ассортимента: ${cand.slice(0, 3).map(s => '«' + esc(short(s.name)) + '»').join(', ')}.` }
    : { cls: 'pos', html: 'Нет товаров, которые одновременно слабо продаются и приносят убыток.' });
  return out;
}
const short = (n, len = 48) => { n = String(n || '').split('/')[0].trim(); return n.length > len ? n.slice(0, len - 1) + '…' : n; };
</script>
<script>
/* =====================================================================
   6. РЕНДЕР: общие элементы
   ===================================================================== */
const charts = {};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function mkChart(id, cfg) {
  const el = document.getElementById(id); if (!el) return;
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  if (!window.Chart) { el.parentElement.innerHTML = '<div class="stub">Графики не загрузились (нет доступа к CDN). Цифры в таблицах при этом актуальны.</div>'; return; }
  Chart.defaults.color = css('--muted'); Chart.defaults.font.family = css('--font'); Chart.defaults.borderColor = css('--line-soft');
  charts[id] = new Chart(el, cfg);
}
const stub = html => `<div class="stub">${html}</div>`;
const srcBadge = src => ({ report: '<span class="src report">из отчёта</span>', manual: '<span class="src manual">вручную</span>', none: '<span class="src none">не заполнено</span>', rates: '<span class="src rates">по ставкам</span>' }[src] || '');
const nameCell = s => `<td class="name sticky-col"><div class="t" title="${esc(s.name)}">${esc(s.name || 'SKU ' + s.sku)}</div><div class="a">${s.article ? 'арт. ' + esc(s.article) + ', ' : ''}SKU ${s.sku}</div></td>`;
const money = (v, known = true) => known ? rub(v) : '<span class="faint">—</span>';
const signed = v => ok(v) ? `<span class="${v < 0 ? 'neg' : ''}">${rub(v)}</span>` : '<span class="faint">—</span>';
/** Ссылка на поле ввода себестоимости на вкладке юнит-экономики. */
const costLink = sku => `<button class="linkbtn nodata" data-goto-cost="${sku}">нет данных о себестоимости</button>`;
const whyNot = s => s.reason === 'нет данных о себестоимости' ? costLink(s.sku) : `<span class="nodata" title="${esc(s.reason)}">${esc(s.reason)}</span>`;

/** Универсальная таблица с сортировкой по клику на заголовок. */
function table(id, cols, rows, opts = {}) {
  const st = S.ui.sort[id] || opts.sort || { key: cols[0].key, dir: -1 };
  const col = cols.find(c => c.key === st.key) || cols[0];
  const v = r => col.sort ? col.sort(r) : col.val ? col.val(r) : null;
  const sorted = [...rows].sort((a, b) => {
    const x = v(a), y = v(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y, 'ru') : x - y) * st.dir;
  });
  const th = cols.map(c => `<th ${c.nosort ? '' : `data-sort="${c.key}"`} class="${c.num ? 'num' : ''} ${c.sticky ? 'sticky-col' : ''}" ${c.key === col.key ? `aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"` : ''} ${c.title ? `title="${esc(c.title)}"` : ''}>${c.label}</th>`).join('');
  const body = sorted.map(r => {
    const tr = `<tr ${opts.rowAttr ? opts.rowAttr(r) : ''}>${cols.map(c => c.cell ? c.cell(r) : `<td class="${c.num ? 'num' : ''}">${c.fmt ? c.fmt(c.val(r), r) : esc(c.val(r))}</td>`).join('')}</tr>`;
    return tr + (opts.after ? opts.after(r) : '');
  }).join('');
  const foot = opts.foot ? `<tfoot><tr>${opts.foot}</tr></tfoot>` : '';
  return `<div class="tbl"><table data-tid="${id}"><thead><tr>${th}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="muted">Нет строк по выбранным условиям</td></tr>`}</tbody>${foot}</table></div>`;
}

/* ---------- Шапка: периоды и отметка о данных ---------- */
function renderHeader() {
  const keys = periodKeys(), sel = $('#periodSel');
  sel.innerHTML = `<option value="all">Все загруженные</option>` + keys.map(k => `<option value="${k}">${monthLabel(k)}</option>`).join('');
  sel.value = keys.includes(S.period) ? S.period : 'all';
  const M = S.model;
  $('#dataStamp').textContent = !M.have.any ? 'Загрузите отчёты, чтобы начать'
    : `${M.range ? 'Данные с ' + isoToRu(M.range.from) + ' по ' + isoToRu(M.range.to) : 'Нет отчётов о продажах за период'}${M.stockDate ? ', остатки на ' + isoToRu(M.stockDate) : ''}`;
  if (apiOn()) $('#dataStamp').textContent += ` · Ozon API: ${S.api.syncing ? 'обновляется…' : S.api.lastSync ? 'обновлено ' + timeRu(S.api.lastSync) : 'ждём первую синхронизацию'}`;
  $('#apiBtn').hidden = !apiOn();
}

/* ---------- KPI-строка ---------- */
function renderKPI() {
  const M = S.model, T = M.totals, el = $('#kpi');
  if (!M.have.any) { el.innerHTML = ''; el.hidden = true; return; }
  el.hidden = false;
  const cs = T.costShare;
  const noReal = !M.have.sales;
  // Налог по всем товарам с продажами (в том числе без себестоимости) — это сумма к уплате за период
  const taxSum = sum(M.skus, s => s.tax || 0), taxBase = sum(M.skus, s => s.taxBase || 0);
  const lossCount = M.skus.filter(s => s.profitKnown && s.profit < 0).length;
  const attention = new Set([...M.skus.filter(s => s.profitKnown && s.profit < 0).map(s => s.sku), ...(M.stock || []).filter(s => s.stock.status === 'crit').map(s => s.sku)]).size;
  const critCount = (M.stock || []).filter(s => s.stock.status === 'crit').length;
  const profitNote = T.profit == null ? (M.ratesSet || M.have.acc ? 'нет себестоимости ни по одному товару' : '<button class="linkbtn" data-goto-tab="data">задайте удержания Ozon</button>, чтобы посчитать')
    : `${T.profit >= 0 ? '<span class="pill pos">в плюсе</span>' : '<span class="pill neg">в убытке</span>'}<br>${T.knownNet < T.net - 1 ? `по ${pct(T.knownNet / T.net, 0)} выручки` : 'по всей выручке'}${!M.taxSet ? ', без налога' : ''}`;
  el.innerHTML = `
    <div class="k"><div class="lbl">Выручка</div><div class="val">${noReal ? '—' : rub(T.net)}</div>
      <div class="note">${noReal ? 'нет отчёта о продажах' : `за вычетом возвратов, ${num(T.netQty)} шт`}</div></div>
    <div class="k"><div class="lbl">Себестоимость</div><div class="val">${T.netCostKnown > 0 ? pct(T.cogsKnown / T.netCostKnown) : '—'}</div>
      <div class="note">${T.cogsKnown ? rub(T.cogsKnown) + ' от выручки товаров, где она известна' : 'от выручки'}</div>
      <div class="cover" title="Доля выручки по источнику себестоимости"><span style="width:${cs.report * 100}%;background:var(--accent)"></span><span style="width:${cs.manual * 100}%;background:var(--warn)"></span><span style="width:${cs.none * 100}%;background:var(--neg)"></span></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>из отчёта ${pct(cs.report, 0)}</span><span><i style="background:var(--warn)"></i>вручную ${pct(cs.manual, 0)}</span><span><i style="background:var(--neg)"></i>нет ${pct(cs.none, 0)}</span></div></div>
    <div class="k"><div class="lbl">Чистая прибыль</div><div class="val ${T.profit < 0 ? 'neg' : ''}">${rub(T.profit)}</div><div class="note">${profitNote}</div></div>
    <div class="k"><div class="lbl">Налог к уплате</div><div class="val">${noReal || !M.taxSet ? '—' : rub(taxSum)}</div>
      <div class="note">${noReal ? 'нет отчёта о продажах' : !M.taxSet ? '<button class="linkbtn" data-goto-tab="data">задайте ставку налога</button>' : `${num(S.settings.rates.tax, S.settings.rates.tax % 1 ? 1 : 0)}% от суммы реализации ${rub(taxBase)}; Ozon его не удерживает`}</div></div>
    <div class="k"><div class="lbl">Маржа и ROI</div><div class="val">${pct(T.margin)}</div><div class="note">ROI ${pct(T.roi, 0)}${T.profit != null ? ' на вложенную себестоимость' : ''}</div></div>
    <div class="k"><div class="lbl">Реклама</div><div class="val">${M.have.ads ? rub(T.ads) : '—'}</div>
      <div class="note">${M.have.ads ? `ДРР ${pct(T.drr)} <span class="pill ${T.drr * 100 > S.settings.drrHigh ? 'neg' : T.drr * 100 < S.settings.drrLow ? 'acc' : 'pos'}">${T.drr * 100 > S.settings.drrHigh ? 'выше нормы' : T.drr * 100 < S.settings.drrLow ? 'ниже нормы' : 'в норме'}</span>` : 'нет отчёта по продвижению за период'}</div></div>
    <div class="k"><div class="lbl">Требуют внимания</div><div class="val ${attention ? 'warn' : ''}">${attention}</div>
      <div class="note">${critCount} с остатком меньше ${S.settings.stockCrit} дн., ${lossCount} в убытке${!M.have.stock ? '<br>остатки не загружены' : ''}</div></div>`;
}

/* ---------- Пустое состояние ---------- */
function emptyState() {
  if (apiOn()) return `<div class="empty">
    <h2>Данные из Ozon загружаются</h2>
    <p class="muted">Магазин подключён по API. Первая синхронизация занимает несколько минут — страница обновится сама. ${S.api.seller.error ? `<br><b class="neg">${esc(S.api.seller.error)}</b>` : ''}</p>
    <p class="muted">Можно не ждать и загрузить выгрузки вручную.</p>
    <label class="btn primary" for="fileInput">Выбрать файлы</label></div>`;
  return `<div class="empty">
    <h2>Загрузите выгрузки из личного кабинета Ozon</h2>
    <p class="muted">Файлы разбираются прямо в браузере и никуда не отправляются. Тип отчёта определяется по колонкам, имя файла не важно. Можно перетащить файлы на страницу.</p>
    <ul class="reports">
      <li><b>Отчёт по начислениям</b><span class="muted">Финансы → Начисления, выгрузка за месяц. Выручка с баллами за скидки, возвраты, комиссия, логистика, эквайринг, хранение и реклама — основа всех расчётов.</span></li>
      <li><b>Аналитика продвижения</b><span class="muted">Расход на рекламу, показы, клики, корзины по кампаниям — ДРР и воронка.</span></li>
      <li><b>Управление остатками</b><span class="muted">Остатки, скорость продаж, дни до обнуления.</span></li>
      <li><b>Цены (CSV)</b><span class="muted">Себестоимость, которую вы указали в Ozon, и цена для покупателя.</span></li>
      <li><b>Отчёт о реализации</b><span class="muted">Не обязателен. Используется, только если нет отчёта по начислениям; в нём нет баллов за скидки и удержаний Ozon.</span></li>
    </ul>
    <label class="btn primary" for="fileInput">Выбрать файлы</label></div>`;
}

/* =====================================================================
   7. ВКЛАДКА «ОБЗОР»
   ===================================================================== */
function renderOverview() {
  const M = S.model, el = $('#tab-overview');
  if (!M.have.any) { el.innerHTML = emptyState(); return; }
  const T = M.totals, ins = buildInsights(M);
  const known = M.skus.filter(s => s.profitKnown);
  const top = [...known].sort((a, b) => b.profit - a.profit).slice(0, 5);
  const bottom = [...known].sort((a, b) => a.profit - b.profit).slice(0, 5);
  const abcSum = g => sum(known.filter(s => s.abcProfit === g), s => s.profit);
  const abcCnt = g => known.filter(s => s.abcProfit === g).length;
  const anyPos = known.some(s => s.profit > 0); // донат имеет смысл только при положительной прибыли
  const list = arr => arr.length ? `<ol class="insights">${arr.map(s => `<li class="${s.profit < 0 ? 'neg' : 'pos'}"><span><span style="display:flex;justify-content:space-between;gap:12px"><span>${esc(short(s.name, 56))}</span><b class="${s.profit < 0 ? 'neg' : ''}" style="white-space:nowrap">${rub(s.profit)}</b></span><span class="small muted">арт. ${esc(s.article || '—')}, маржа ${pct(s.margin)}</span></span></li>`).join('')}</ol>` : stub('Нет товаров с посчитанной прибылью.');
  el.innerHTML = `
    <div class="stack">
      <div class="panel"><div class="panel-head"><h2>Выводы за ${S.period === 'all' ? 'все загруженные данные' : monthLabel(S.period).toLowerCase()}</h2></div>
        <ul class="insights">${ins.map(i => `<li class="${i.cls}"><span>${i.html}</span></li>`).join('')}</ul>
        ${M.notes.map(n => `<p class="small warn" style="margin-top:10px">${esc(n)}</p>`).join('')}</div>
      <div class="grid2">
        <div class="panel"><div class="panel-head"><h2>Нитка прибыли</h2><p>${T.knownCount && T.knownCount < M.skus.filter(s => s.hasSales).length ? `По ${nTov(T.knownCount)} с известной себестоимостью и удержаниями (${pct(T.knownNet / T.net, 0)} выручки).` : 'Куда уходит выручка.'}</p></div>
          ${T.profit == null ? stub('Появится, когда будут известны себестоимость и удержания Ozon хотя бы по одному товару.') : '<div class="chartbox"><canvas id="chWaterfall"></canvas></div>'}</div>
        <div class="panel"><div class="panel-head"><h2>Тренд по срезам</h2><p>График наполняется только когда вы нажимаете «Сохранить срез» — сам он историю не собирает. Делайте срез после загрузки отчётов за новый период.</p></div>
          ${S.snapshots.length < 2 ? stub(`Сохранено срезов: <b>${S.snapshots.length}</b>. Для линии нужно минимум два.`) : '<div class="chartbox"><canvas id="chTrend"></canvas></div>'}
          ${S.snapshots.length ? `<details style="margin-top:10px"><summary class="small muted">Сохранённые срезы</summary>${table('snaps', [
            { key: 'ts', label: 'Когда', val: r => r.ts, fmt: v => new Date(v).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }) },
            { key: 'label', label: 'Период', val: r => r.label },
            { key: 'revenue', label: 'Выручка', num: 1, val: r => r.revenue, fmt: v => rub(v) },
            { key: 'profit', label: 'Прибыль', num: 1, val: r => r.profit, fmt: v => rub(v) },
            { key: 'margin', label: 'Маржа', num: 1, val: r => r.margin, fmt: v => pct(v) },
            { key: 'drr', label: 'ДРР', num: 1, val: r => r.drr, fmt: v => pct(v) },
            { key: 'del', label: '', nosort: 1, cell: r => `<td><button class="linkbtn small" data-del-snap="${r.ts}">удалить</button></td>` }], S.snapshots, { sort: { key: 'ts', dir: -1 } })}</details>` : ''}</div>
      </div>
      <div class="grid2">
        <div class="panel"><div class="panel-head"><h2>Прибыль по категориям</h2><p>Категория определяется по названию товара, её можно изменить на вкладке «Данные и настройки».</p></div>
          ${M.cats.length ? table('cats', [
            { key: 'name', label: 'Категория', val: r => r.name },
            { key: 'count', label: 'Товаров', num: 1, val: r => r.count, fmt: v => num(v) },
            { key: 'net', label: 'Выручка', num: 1, val: r => r.net, fmt: v => rub(v) },
            { key: 'profit', label: 'Прибыль', num: 1, val: r => r.profit, fmt: (v, r) => ok(v) ? signed(v) + (r.partial ? '<div class="small faint">частично</div>' : '') : '<span class="nodata">нет данных</span>' },
            { key: 'margin', label: 'Маржа', num: 1, val: r => r.margin, fmt: v => pct(v) }], M.cats, { sort: { key: 'net', dir: -1 } }) : stub('Нет продаж за период.')}</div>
        <div class="panel"><div class="panel-head"><h2>ABC по чистой прибыли</h2><p>A — товары, которые дают первые 80% прибыли, B — следующие 15%, C — остальные и убыточные.</p></div>
          ${known.length && !anyPos ? stub(`Ни один товар с посчитанной прибылью пока не прибылен (${nTov(known.length)} в убытке на ${rub(sum(known, s => s.profit))}) — делить на группы A/B/C нечего. Проверьте себестоимость и тарифы Ozon на вкладке «Данные и настройки».`) : known.length ? `<div style="display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:18px;align-items:center"><div class="chartbox short"><canvas id="chAbc"></canvas></div>
            <dl class="kv">${['A', 'B', 'C'].map(g => `<dt>Группа ${g}, ${nTov(abcCnt(g))}</dt><dd>${signed(abcSum(g))}</dd>`).join('')}</dl></div>` : stub('Появится, когда будет посчитана прибыль хотя бы по одному товару.')}</div>
      </div>
      <div class="grid2">
        <div class="panel"><div class="panel-head"><h2>Топ-5 по прибыли</h2></div>${known.length && !anyPos ? stub('Нет прибыльных товаров за период.') : list(top.filter(s => s.profit > 0))}</div>
        <div class="panel"><div class="panel-head"><h2>Антитоп-5 по прибыли</h2></div>${list(bottom)}</div>
      </div>
    </div>`;
  // Нитка прибыли (waterfall из «плавающих» столбцов)
  if (T.profit != null) {
    const w = T.wf; let lvl = w.gross; const steps = [['Выручка', w.gross, 'plus']];
    for (const [l, v] of [['Возвраты', w.returns], ['Себестоимость', w.cogs], ['Услуги Ozon', w.ozon], ['Реклама', w.ads], ['Налог', w.tax]]) { steps.push([l, -v, 'minus', lvl]); lvl -= v; }
    steps.push(['Прибыль', w.profit, 'res']);
    mkChart('chWaterfall', {
      type: 'bar',
      data: { labels: steps.map(s => s[0]), datasets: [{ data: steps.map(s => s[2] === 'minus' ? [s[3] + s[1], s[3]] : [0, s[1]]), backgroundColor: steps.map(s => s[2] === 'plus' ? css('--accent') : s[2] === 'res' ? (s[1] >= 0 ? css('--pos') : css('--neg')) : 'rgba(238,123,107,.65)'), borderRadius: 3 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => rub(steps[c.dataIndex][1]) } } }, scales: { y: { ticks: { callback: v => nf0.format(v) } } } }
    });
  }
  if (S.snapshots.length >= 2) {
    const snaps = [...S.snapshots].sort((a, b) => a.ts.localeCompare(b.ts));
    mkChart('chTrend', {
      type: 'line',
      data: { labels: snaps.map(s => `${s.label}, ${new Date(s.ts).toLocaleDateString('ru-RU')}`), datasets: [
        { label: 'Выручка', data: snaps.map(s => s.revenue), borderColor: css('--accent'), backgroundColor: css('--accent'), tension: .25 },
        { label: 'Прибыль', data: snaps.map(s => s.profit), borderColor: css('--pos'), backgroundColor: css('--pos'), tension: .25, spanGaps: true }] },
      options: { maintainAspectRatio: false, scales: { y: { ticks: { callback: v => nf0.format(v) } }, x: { ticks: { maxRotation: 0, autoSkip: true } } }, plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}: ${rub(c.raw)}` } } } }
    });
  }
  if (known.length && anyPos) mkChart('chAbc', {
    type: 'doughnut',
    data: { labels: ['A', 'B', 'C'], datasets: [{ data: ['A', 'B', 'C'].map(g => Math.max(0, abcSum(g))), backgroundColor: [css('--pos'), css('--accent'), css('--faint')], borderWidth: 0 }] },
    options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `Группа ${c.label}: ${rub(abcSum(c.label))}` } } } }
  });
}

/* =====================================================================
   8. ВКЛАДКА «ПЛАН-ФАКТ»
   Факт берётся из отчётов, пересекающихся с месяцем плана. Темп: сравниваем
   факт с ожидаемой долей плана на дату последних данных.
   ===================================================================== */
function renderPlan() {
  const el = $('#tab-plan'), P = S.plan, key = P.month || todayISO().slice(0, 7);
  const PM = buildModel(key);
  const T = PM.totals, dim = daysInMonth(key);
  const cov = PM.have.sales ? PM.range : null;
  const today = todayISO(), tKey = today.slice(0, 7);
  const elapsedToday = key < tKey ? 1 : key > tKey ? 0 : (+today.slice(8, 10)) / dim;
  const dataEndDay = cov ? +cov.to.slice(8, 10) : 0;
  const expectedAtData = cov ? dataEndDay / dim : 0;
  const avgPrice = T.netQty > 0 ? T.net / T.netQty : (S.model.totals.netQty > 0 ? S.model.totals.net / S.model.totals.netQty : null);
  const latestKey = periodKeys().filter(k => datasetsFor('realization', k).length || datasetsFor('accruals', k).some(d => d.data.hasSales)).pop();
  const statusOf = r => r >= 0.97 ? ['pos', 'идёте по графику'] : r >= 0.85 ? ['warn', 'немного отстаёте'] : ['neg', 'сильно отстаёте'];
  function bar(label, fact, plan, fmt, note = '') {
    if (!ok(plan) || plan <= 0) return `<div class="panel"><h3>${label}</h3>${stub('План не задан.')}</div>`;
    if (fact == null) return `<div class="panel"><h3>${label}</h3>${stub(note || 'Нет факта за этот месяц.')}</div>`;
    const done = fact / plan, exp = expectedAtData, [cls, txt] = exp > 0 ? statusOf(done / exp) : ['gray', 'нет данных'];
    return `<div class="panel"><div class="panel-head"><h3>${label}</h3><span class="pill ${cls}">${txt}</span></div>
      <div class="bigpair"><div><div class="small muted">Факт</div><div class="v">${fmt(fact)}</div></div><div><div class="small muted">План</div><div class="v muted">${fmt(plan)}</div></div></div>
      <div class="pbar" aria-label="Выполнено ${pct(done, 0)}"><div class="fill" style="width:${Math.min(100, done * 100)}%;background:var(--${cls === 'gray' ? 'accent' : cls})"></div>
        <div class="mark" style="left:${Math.min(100, expectedAtData * 100)}%" data-l="ожидается ${pct(expectedAtData, 0)}"></div>
        ${Math.abs(elapsedToday - expectedAtData) > 0.02 && elapsedToday > 0 && elapsedToday < 1 ? `<div class="mark" style="left:${elapsedToday * 100}%;opacity:.35" data-l=""></div>` : ''}</div>
      <p class="small muted">Выполнено ${pct(done, 0)} плана. На ${cov ? isoToRu(cov.to) + ' (последние данные)' : '—'} по равномерному темпу ожидалось ${pct(expectedAtData, 0)}.${note ? ' ' + note : ''}</p></div>`;
  }
  let body;
  if (!PM.have.sales) {
    body = stub(`За <b>${monthLabel(key).toLowerCase()}</b> нет отчёта по начислениям или о реализации, поэтому выполнение плана не считается — это не значит, что факт нулевой.
      ${periodKeys().length ? `Загружены данные за: ${periodKeys().map(k => monthLabel(k).toLowerCase()).join(', ')}.` : ''}
      ${latestKey && latestKey !== key ? `<br><br><button class="btn small" data-plan-month="${latestKey}">Посмотреть план-факт за ${monthLabel(latestKey).toLowerCase()}</button>` : ''}`);
  } else {
    const daysLeft = dim - dataEndDay;
    const perDay = T.net / cov.days;
    const need = ok(P.revenue) && daysLeft > 0 ? Math.max(0, P.revenue - T.net) / daysLeft : null;
    const planQty = ok(P.revenue) && avgPrice ? P.revenue / avgPrice : null;
    body = `<div class="grid3">
      ${bar('Выручка', T.net, P.revenue, rub)}
      ${bar('Чистая прибыль', T.profit, P.profit, rub, T.profit != null && T.knownNet < T.net - 1 ? `Прибыль посчитана по ${pct(T.knownNet / T.net, 0)} выручки.` : T.profit == null ? 'Прибыль не считается: нет себестоимости или удержаний.' : '')}
      ${bar('Продажи, шт', T.netQty, planQty, v => num(v) + ' шт', planQty ? `План в штуках = план выручки ÷ средняя цена продажи ${rub(avgPrice)}.` : '')}
    </div>
    <div class="panel"><div class="panel-head"><h2>Нужный темп</h2><p>Данные есть по ${isoToRu(cov.to)}: ${cov.days} ${plural(cov.days, 'день', 'дня', 'дней')} из ${dim}.</p></div>
      ${!ok(P.revenue) ? stub('Задайте план выручки, чтобы увидеть нужный темп.') : daysLeft <= 0 ? stub(`Месяц закрыт по данным. Итог: ${pct(T.net / P.revenue, 0)} плана выручки.`) :
      `<div class="bigpair"><div><div class="small muted">Сейчас в среднем в день</div><div class="v">${rub(perDay)}</div></div>
       <div><div class="small muted">Нужно в день до конца месяца (${daysLeft} ${plural(daysLeft, 'день', 'дня', 'дней')})</div><div class="v ${need > perDay ? 'neg' : 'pos'}">${rub(need)}</div></div></div>
       <p style="margin-top:12px">${need <= perDay ? `Текущего темпа хватает: запас ${rub(perDay - need)} в день.` : `Нужно ускориться на ${pct(need / perDay - 1, 0)} — это ещё ${rub(need - perDay)} выручки в день.`}</p>`}</div>
    ${Object.keys(P.cats || {}).some(k => ok(P.cats[k]?.revenue) || ok(P.cats[k]?.profit)) ? `<div class="panel"><div class="panel-head"><h2>По категориям</h2></div><div class="grid3">${PM.cats.filter(c => P.cats[c.name]).map(c => {
      const pc = P.cats[c.name];
      const row = (lbl, f, p) => { if (!ok(p) || p <= 0) return ''; if (f == null) return `<p class="small">${lbl}: <span class="nodata">нет данных</span></p>`; const d = f / p, [cls, t] = statusOf(expectedAtData ? d / expectedAtData : 0); return `<p class="small" style="margin-top:8px">${lbl}: ${rub(f)} из ${rub(p)} <span class="pill ${cls}">${t}</span></p><div class="pbar"><div class="fill" style="width:${Math.min(100, d * 100)}%;background:var(--${cls})"></div><div class="mark" style="left:${expectedAtData * 100}%" data-l=""></div></div>`; };
      return `<div><h3>${esc(c.name)}</h3>${row('Выручка', c.net, pc.revenue)}${row('Прибыль', c.profit, pc.profit)}</div>`; }).join('')}</div></div>` : ''}`;
  }
  const catNames = [...new Set([...PM.cats.map(c => c.name), ...S.model.cats.map(c => c.name)])];
  el.innerHTML = `<div class="stack">
    <div class="panel"><div class="panel-head"><h2>План на месяц</h2><p>Сохраняется в браузере. План в штуках считается сам из плана выручки.</p></div>
      <div class="form-row">
        <label>Месяц<input type="month" id="planMonth" value="${key}"></label>
        <label>Выручка, ₽<input type="number" id="planRev" min="0" step="1000" value="${P.revenue ?? ''}"></label>
        <label>Чистая прибыль, ₽<input type="number" id="planProfit" step="1000" value="${P.profit ?? ''}"></label>
        <button class="btn primary" id="planSave">Сохранить план</button>
      </div>
      <details style="margin-top:14px"><summary class="small muted">План по категориям</summary>
        <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Категория</th><th class="num">Выручка, ₽</th><th class="num">Прибыль, ₽</th></tr></thead><tbody>
        ${catNames.map(n => `<tr><td>${esc(n)}</td><td class="num"><input type="number" data-plan-cat="${esc(n)}" data-f="revenue" value="${P.cats?.[n]?.revenue ?? ''}"></td><td class="num"><input type="number" data-plan-cat="${esc(n)}" data-f="profit" value="${P.cats?.[n]?.profit ?? ''}"></td></tr>`).join('') || '<tr><td colspan="3" class="muted">Категории появятся после загрузки отчётов</td></tr>'}
        </tbody></table></div></details>
    </div>${body}</div>`;
}

/* =====================================================================
   9. ВКЛАДКА «ЮНИТ-ЭКОНОМИКА»
   Цепочка на одну проданную единицу: цена → минус статьи → прибыль/шт.
   ===================================================================== */
function unitRow(s) {
  const q = s.soldQty || 1;
  return {
    // себестоимость — полная за штуку; себестоимость вернувшихся товаров учтена в строке возвратов
    price: s.gross / q, cost: s.cost.v, acq: s.fees.acquiring / q, log: s.fees.logistics / q, stor: s.fees.storage / q,
    ads: s.ads.total / q, comm: s.fees.commission / q, tax: s.tax / q,
    retpen: (s.returns - (s.cost.v != null ? s.cost.v * s.retQty : 0) + s.fees.penalties) / q, other: s.fees.other / q
  };
}
function costInput(s) {
  const c = s.cost;
  return `<div class="cost-cell"><input type="number" min="0" step="0.01" id="cost-${s.sku}" data-cost="${s.sku}" value="${c.v ?? ''}" placeholder="₽ за шт" aria-label="Себестоимость ${esc(short(s.name))}">
    ${srcBadge(c.src)}${c.src === 'manual' && c.report != null ? `<button class="linkbtn small" data-reset-cost="${s.sku}" title="Вернуть значение из отчёта (${rub(c.report, 2)})">из отчёта</button>` : ''}</div>`;
}
function renderUnits() {
  const M = S.model, el = $('#tab-units');
  if (!M.have.any) { el.innerHTML = emptyState(); return; }
  const f = S.ui.filters.units ||= { q: '', cat: '', src: '' };
  const withSales = M.skus.filter(s => s.hasSales);
  const noCost = M.skus.filter(s => s.cost.src === 'none' && (s.hasSales || s.stock));
  const calc = withSales.filter(s => s.profitKnown);
  const pos = calc.filter(s => s.profit > 0);
  el.innerHTML = `<div class="stack">
    <div class="panel"><div class="panel-head"><h2>Юнит-экономика каталога</h2><p>${!M.ratesSet && !M.have.acc ? '<b class="warn">Удержания Ozon не заданы.</b> Отчёт о реализации не содержит комиссий и логистики — загрузите отчёт по начислениям или <button class="linkbtn" data-goto-tab="data">задайте ставки</button>.' : M.have.acc ? 'Удержания — из отчёта по начислениям (факт).' : 'Удержания Ozon посчитаны по заданным ставкам — это оценка, а не факт.'}</p></div>
      <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
        <div><div class="small muted">Средняя маржа</div><div class="v" style="font-size:24px;font-weight:600">${pct(M.totals.margin)}</div></div>
        <div><div class="small muted">Средний ROI</div><div class="v" style="font-size:24px;font-weight:600">${pct(M.totals.roi, 0)}</div></div>
        <div><div class="small muted">С положительной юниткой</div><div class="v" style="font-size:24px;font-weight:600">${withSales.length ? pct(pos.length / withSales.length, 0) : '—'}</div><div class="small muted">${pos.length} из ${withSales.length} с продажами</div></div>
        <div><div class="small muted">Не посчитать</div><div class="v ${withSales.length - calc.length ? 'warn' : ''}" style="font-size:24px;font-weight:600">${withSales.length ? pct((withSales.length - calc.length) / withSales.length, 0) : '—'}</div><div class="small muted">${withSales.filter(s => s.cost.src === 'none').length} без себестоимости</div></div>
      </div></div>
    ${noCost.length ? `<div class="panel" id="noCostBlock" style="border:1px solid rgba(238,123,107,.35)"><div class="panel-head"><h2>Нет данных о себестоимости</h2><p>Себестоимость этих товаров не найдена ни в одном отчёте. Пока её нет, прибыль, маржа и ROI по ним не считаются. Введите закупочную цену за штуку — она сохранится в браузере и применится к будущим отчётам.</p></div>
      ${table('nocost', [
        { key: 'name', label: 'Товар', sticky: 1, val: s => s.name, cell: nameCell },
        { key: 'net', label: 'Выручка', num: 1, val: s => s.net, fmt: v => rub(v) },
        { key: 'price', label: 'Цена продажи', num: 1, val: s => s.avgPrice, fmt: v => rub(v) },
        { key: 'cost', label: 'Себестоимость, ₽/шт', nosort: 1, cell: s => `<td>${costInput(s)}</td>` }], noCost, { sort: { key: 'net', dir: -1 } })}</div>` : ''}
    <div class="panel"><div class="panel-head"><h2>Цепочка на единицу товара</h2><p>Всё на одну проданную штуку. Реклама = расход на рекламу по SKU (включая долю кампаний «на все товары») ÷ продажи. Штрафы есть только в отчёте по начислениям.</p></div>
      <div class="filters">
        <input type="search" id="uQ" placeholder="Название, артикул или SKU" value="${esc(f.q)}" aria-label="Поиск">
        <select id="uCat" aria-label="Категория"><option value="">Все категории</option>${M.cats.map(c => `<option ${f.cat === c.name ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
        <select id="uSrc" aria-label="Себестоимость"><option value="">Любая себестоимость</option><option value="report" ${f.src === 'report' ? 'selected' : ''}>из отчёта</option><option value="manual" ${f.src === 'manual' ? 'selected' : ''}>вручную</option><option value="none" ${f.src === 'none' ? 'selected' : ''}>не заполнено</option></select>
      </div><div id="unitsTable"></div></div></div>`;
  renderUnitsTable();
}
function matchQ(s, q) { q = norm(q); return !q || norm(s.name).includes(q) || norm(s.article) === q || norm(s.article).startsWith(q) || String(s.sku).includes(q); }
function renderUnitsTable() {
  const M = S.model, f = S.ui.filters.units;
  const rows = M.skus.filter(s => s.hasSales && matchQ(s, f.q) && (!f.cat || s.category === f.cat) && (!f.src || s.cost.src === f.src));
  const u = s => unitRow(s);
  const minus = key => ({ num: 1, val: s => u(s)[key], fmt: (v, s) => s.feeSrc === 'none' && ['acq', 'log', 'stor', 'comm', 'other'].includes(key) ? '<span class="faint">?</span>' : ok(v) ? (Math.abs(v) < 0.005 ? '0\u00a0₽' : rub(-v, 2)) : '—' });
  $('#unitsTable').innerHTML = table('units', [
    { key: 'name', label: 'Товар', sticky: 1, val: s => s.name, cell: nameCell },
    { key: 'cat', label: 'Категория', val: s => s.category },
    { key: 'cost', label: 'Себестоимость', sort: s => s.cost.v, cell: s => `<td>${costInput(s)}</td>` },
    { key: 'price', label: 'Цена продажи', num: 1, val: s => u(s).price, fmt: v => rub(v, 2) },
    { key: 'ucost', label: '− Себест.', num: 1, val: s => u(s).cost, fmt: v => ok(v) ? rub(-v, 2) : '<span class="nodata">нет</span>' },
    { key: 'acq', label: '− Эквайринг', ...minus('acq') },
    { key: 'log', label: '− Логистика', ...minus('log') },
    { key: 'stor', label: '− Хранение', ...minus('stor') },
    { key: 'ads', label: '− Реклама', ...minus('ads') },
    { key: 'comm', label: '− Комиссия', ...minus('comm') },
    { key: 'tax', label: '− Налог', ...minus('tax'), title: S.model.taxSet ? '' : 'Ставка налога не задана' },
    { key: 'retpen', label: '− Возвраты и штрафы', ...minus('retpen') },
    { key: 'other', label: '− Прочее', ...minus('other') },
    { key: 'ppu', label: '= Прибыль/шт', num: 1, val: s => s.ppu, cell: s => `<td class="num">${s.profitKnown ? `<b class="${s.ppu < 0 ? 'neg' : 'pos'}">${rub(s.ppu, 2)}</b>` : whyNot(s)}</td>` },
    { key: 'margin', label: 'Маржа', num: 1, val: s => s.margin, fmt: (v, s) => s.profitKnown ? pct(v) : '—' },
    { key: 'roi', label: 'ROI', num: 1, val: s => s.roi, fmt: (v, s) => s.profitKnown ? pct(v, 0) : '—' },
    { key: 'fsrc', label: 'Удержания', val: s => s.feeSrc, fmt: v => v === 'none' ? '<span class="src none">не заданы</span>' : srcBadge(v) }
  ], rows, { sort: { key: 'ppu', dir: -1 } });
}
</script>
<script>
/* =====================================================================
   10. ВКЛАДКА «ТОВАРЫ»
   ===================================================================== */
function renderProducts() {
  const M = S.model, el = $('#tab-products');
  if (!M.have.any) { el.innerHTML = emptyState(); return; }
  const f = S.ui.filters.products ||= { q: '', cat: '' };
  el.innerHTML = `<div class="panel"><div class="panel-head"><h2>Товары</h2><p>Нажмите на строку, чтобы открыть детализацию: нитку прибыли, воронку, остаток и рекомендацию по поставке. ABC по прибыли и по выручке — разные срезы.</p></div>
    <div class="filters"><input type="search" id="pQ" placeholder="Название, артикул или SKU" value="${esc(f.q)}" aria-label="Поиск">
    <select id="pCat" aria-label="Категория"><option value="">Все категории</option>${M.cats.map(c => `<option ${f.cat === c.name ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div id="productsTable"></div></div>`;
  renderProductsTable();
}
function renderProductsTable() {
  const M = S.model, f = S.ui.filters.products;
  const rows = M.skus.filter(s => (s.hasSales || s.ads.total > 0 || s.stock) && matchQ(s, f.q) && (!f.cat || s.category === f.cat));
  const fee = k => (v, s) => s.feeSrc === 'none' ? '<span class="faint">?</span>' : rub(v);
  const cols = [
    { key: 'name', label: 'Товар', sticky: 1, val: s => s.name, cell: nameCell },
    { key: 'cat', label: 'Категория', val: s => s.category },
    { key: 'abcP', label: 'ABC прибыль', val: s => s.abcProfit || null, fmt: v => v ? `<span class="pill ${v === 'A' ? 'pos' : v === 'B' ? 'acc' : 'gray'}">${v}</span>` : '<span class="faint">—</span>' },
    { key: 'abcR', label: 'ABC выручка', val: s => s.abcRevenue || null, fmt: v => v ? `<span class="pill ${v === 'A' ? 'pos' : v === 'B' ? 'acc' : 'gray'}">${v}</span>` : '<span class="faint">—</span>' },
    { key: 'cost', label: 'Себест./шт', num: 1, val: s => s.cost.v, fmt: (v, s) => ok(v) ? `${rub(v, 2)}<div>${srcBadge(s.cost.src)}</div>` : costLink(s.sku) },
    { key: 'price', label: 'Цена', num: 1, val: s => s.avgPrice, fmt: v => rub(v, 2) },
    { key: 'qty', label: 'Продано, шт', num: 1, val: s => s.soldQty, fmt: v => num(v) },
    { key: 'net', label: 'Выручка', num: 1, val: s => s.net, fmt: v => rub(v) },
    { key: 'acq', label: 'Эквайринг', num: 1, val: s => s.fees.acquiring, fmt: fee() },
    { key: 'log', label: 'Логистика', num: 1, val: s => s.fees.logistics, fmt: fee() },
    { key: 'stor', label: 'Хранение', num: 1, val: s => s.fees.storage, fmt: fee() },
    { key: 'comm', label: 'Комиссия', num: 1, val: s => s.fees.commission, fmt: fee() },
    { key: 'ads', label: 'Реклама', num: 1, val: s => s.ads.total, fmt: (v, s) => M.have.ads || s.accr ? rub(v) : '<span class="faint">нет отчёта</span>' },
    { key: 'drr', label: 'ДРР', num: 1, val: s => s.drr, fmt: v => pct(v) },
    { key: 'tax', label: 'Налоги', num: 1, val: s => s.tax, fmt: v => M.taxSet ? rub(v) : '<span class="faint" title="Ставка налога не задана">—</span>' },
    { key: 'pen', label: 'Штрафы', num: 1, val: s => s.fees.penalties, fmt: (v, s) => s.accr ? rub(v) : '<span class="faint" title="Штрафы есть только в отчёте по начислениям">—</span>' },
    { key: 'ret', label: 'Возвраты', num: 1, val: s => s.returns, fmt: (v, s) => `${rub(v)}${s.retQty ? `<div class="small faint">${s.retQty} шт</div>` : ''}` },
    { key: 'other', label: 'Прочие', num: 1, val: s => s.fees.other, fmt: fee() },
    { key: 'profit', label: 'Прибыль', num: 1, val: s => s.profit, cell: s => `<td class="num">${s.profitKnown ? `<b class="${s.profit < 0 ? 'neg' : ''}">${rub(s.profit)}</b>` : whyNot(s)}</td>` },
    { key: 'ppu', label: 'Прибыль/шт', num: 1, val: s => s.ppu, fmt: v => signed(v) },
    { key: 'roi', label: 'ROI', num: 1, val: s => s.roi, fmt: v => pct(v, 0) },
    { key: 'margin', label: 'Маржа', num: 1, val: s => s.margin, fmt: v => pct(v) },
    { key: 'share', label: 'Доля выручки', num: 1, val: s => s.share, fmt: v => pct(v) }
  ];
  $('#productsTable').innerHTML = table('products', cols, rows, {
    sort: { key: 'net', dir: -1 },
    rowAttr: s => `class="clickable ${S.ui.expanded.has(s.sku) ? 'open' : ''}" data-expand="${s.sku}" tabindex="0" aria-expanded="${S.ui.expanded.has(s.sku)}"`,
    after: s => S.ui.expanded.has(s.sku) ? `<tr class="detail"><td colspan="${cols.length}">${productDetail(s)}</td></tr>` : ''
  });
}
function productDetail(s) {
  const M = S.model;
  // Нитка прибыли по товару
  let wf;
  if (!s.hasSales) wf = stub('Нет продаж за период.');
  else {
    const items = [['Выручка', s.gross, 'plus'], ['Возвраты', -s.returns], ['Себестоимость', s.cogs != null ? -s.cogs : null], ['Комиссия', -s.fees.commission], ['Эквайринг', -s.fees.acquiring], ['Логистика', -s.fees.logistics], ['Хранение', -s.fees.storage], ['Штрафы и прочее', -(s.fees.penalties + s.fees.other)], ['Реклама', -s.ads.total], ['Налог', -s.tax], ['Прибыль', s.profit, 'res']];
    const max = s.gross || 1;
    wf = items.map(([l, v, t]) => `<div class="wf-row"><span class="muted">${l}</span><span>${ok(v) ? `<div class="wf-bar ${t || ''} ${t === 'res' && v < 0 ? 'neg' : ''}" style="width:${Math.min(100, Math.abs(v) / max * 100)}%"></div>` : ''}</span><span class="num">${ok(v) ? rub(v) : l === 'Прибыль' ? whyNot(s) : l === 'Себестоимость' ? costLink(s.sku) : '—'}</span></div>`).join('')
      + (s.feeSrc === 'none' ? '<p class="small warn" style="margin-top:6px">Удержания Ozon не заданы.</p>' : s.feeSrc === 'rates' ? '<p class="small muted" style="margin-top:6px">Удержания — по ставкам, это оценка.</p>' : '');
  }
  // Мини-воронка
  const a = s.ads;
  const fn = a.impr > 0 ? [['Показы (реклама)', a.impr], ['Клики', a.clicks], ...(M.adsHasCarts ? [['В корзину', a.carts]] : []), ['Заказано из рекламы', a.orders], ['Выкуплено', s.netQty]]
    : null;
  const funnel = fn ? `<dl class="kv">${fn.map(([l, v], i) => `<dt>${l}</dt><dd>${num(v)}${i > 0 && fn[i - 1][1] > 0 && i < fn.length - 1 ? ` <span class="small faint">${pct(v / fn[i - 1][1], 1)}</span>` : ''}</dd>`).join('')}
      <dt>Выкуп</dt><dd>${pct(s.buyout)}</dd></dl>${s.prices?.impr ? `<p class="small muted" style="margin-top:8px">Всего показов карточки по файлу цен: ${num(s.prices.impr)}, конверсия в заказ ${pct(s.prices.conv, 2)} (за период, выбранный при выгрузке).</p>` : ''}`
    : s.prices?.impr ? `<dl class="kv"><dt>Показы карточки</dt><dd>${num(s.prices.impr)}</dd><dt>Заказано</dt><dd>${num(s.prices.ordersQty)}</dd><dt>Конверсия в заказ</dt><dd>${pct(s.prices.conv, 2)}</dd><dt>Выкуп</dt><dd>${pct(s.buyout)}</dd></dl><p class="small muted" style="margin-top:8px">Данные файла цен — за период, выбранный при выгрузке. Рекламных показов в периоде не было.</p>`
      : stub('Нет данных о показах: товар не продвигался, а файл цен не загружен.');
  // Остаток
  const st = s.stock;
  const stock = st ? `<dl class="kv"><dt>Доступно к продаже</dt><dd>${num(st.available)} шт</dd><dt>В пути и в заявках</dt><dd>${num(st.inbound)} шт</dd>
      <dt>Скорость продаж</dt><dd>${ok(st.vel) ? num(st.vel, 2) + ' шт/день' : '—'}</dd><dt>Хватит на</dt><dd>${st.days != null ? st.days + ' дн.' : '—'}</dd>
      <dt>Обнулится</dt><dd>${st.runOut ? isoToRu(st.runOut) : '—'}</dd>${st.liquidity ? `<dt>Статус Ozon</dt><dd>${esc(st.liquidity)}</dd>` : ''}</dl>
      <p style="margin-top:10px"><span class="pill ${st.advice.level}">${esc(st.advice.text)}</span></p>${st.velSrc ? `<p class="small faint" style="margin-top:4px">Скорость: ${st.velSrc}</p>` : ''}`
    : stub('Товара нет в отчёте по остаткам.');
  return `<div class="detail-grid"><div><h4 style="margin-bottom:8px">Нитка прибыли</h4>${wf}</div><div><h4 style="margin-bottom:8px">Воронка</h4>${funnel}</div><div><h4 style="margin-bottom:8px">Остаток и поставка</h4>${stock}</div></div>`;
}

      <div class="panel"><div class="panel-head"><h2>Расход и эффективность</h2></div>
        <dl class="kv" style="font-size:15px"><dt>Расход на рекламу</dt><dd>${rub(C.spend)}</dd>

function renderStock() {
  const M = S.model, el = $('#tab-stock'), set = S.settings;
  if (!M.have.any) { el.innerHTML = emptyState(); return; }
  const form = `<div class="form-row">
      <label>Критично, если хватит меньше чем на, дн.<input type="number" min="1" id="thCrit" value="${set.stockCrit}"></label>
      <label>Требует внимания — меньше чем на, дн.<input type="number" min="1" id="thWarn" value="${set.stockWarn}"></label>
      <label>Поставку считать на, дн.<input type="number" min="7" id="thSupply" value="${set.supplyDays}"></label></div>`;
  if (!M.have.stock) { el.innerHTML = `<div class="stack"><div class="panel"><h2>Остатки</h2><div style="margin-top:12px">${stub('Загрузите отчёт <b>«Управление остатками»</b>, чтобы увидеть сроки до обнуления и рекомендации по поставке.')}</div></div><div class="panel">${form}</div></div>`; return; }
  const list = M.stock;
  const cnt = st => list.filter(s => s.stock.status === st).length;
  const buckets = [['до 7', 0, 7], ['7–14', 7, 14], ['14–30', 14, 30], ['30–60', 30, 60], ['больше 60', 60, Infinity]];
  const bc = buckets.map(([, a, b]) => list.filter(s => s.stock.days != null && s.stock.days >= a && s.stock.days < b).length);
  const soon = list.filter(s => s.stock.days != null).sort((a, b) => a.stock.days - b.stock.days).slice(0, 8);
  const statusPill = st => ({ crit: '<span class="pill neg">критично</span>', warn: '<span class="pill warn">внимание</span>', ok: '<span class="pill pos">в норме</span>', nosales: '<span class="pill gray">нет продаж</span>', unknown: '<span class="pill gray">нет данных</span>' }[st]);

    <div class="panel"><div class="panel-head"><h2>Остатки на ${isoToRu(M.stockDate)}</h2><p>Скорость продаж — среднесуточные продажи за 28 дней из отчёта Ozon; если её нет — по продажам за выбранный период.</p></div>
      <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div><div class="small muted">Критично, меньше ${set.stockCrit} дн.</div><div style="font-size:28px;font-weight:600" class="${cnt('crit') ? 'neg' : ''}">${cnt('crit')}</div></div>
        <div><div class="small muted">Внимание, ${set.stockCrit}–${set.stockWarn} дн.</div><div style="font-size:28px;font-weight:600" class="${cnt('warn') ? 'warn' : ''}">${cnt('warn')}</div></div>
        <div><div class="small muted">В норме</div><div style="font-size:28px;font-weight:600">${cnt('ok')}</div></div>
        <div><div class="small muted">Без продаж</div><div style="font-size:28px;font-weight:600" class="muted">${cnt('nosales') + cnt('unknown')}</div></div>
      </div><div style="margin-top:16px">${form}</div></div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h2>Сколько дней хватит остатка</h2></div><div class="chartbox short"><canvas id="chStock"></canvas></div></div>
      <div class="panel"><div class="panel-head"><h2>Ближе всего к обнулению</h2></div>
        ${soon.length ? `<ol class="insights">${soon.map(s => `<li class="${s.stock.status === 'crit' ? 'neg' : s.stock.status === 'warn' ? 'warn' : 'pos'}"><span><span style="display:flex;justify-content:space-between;gap:12px"><span>${esc(short(s.name, 50))}</span><b style="white-space:nowrap">${s.stock.days} дн.</b></span><span class="small muted">арт. ${esc(s.article || '—')}, ${num(s.stock.available)} шт, обнулится ~${isoToRu(s.stock.runOut)}</span></span></li>`).join('')}</ol>` : stub('Нет товаров с продажами.')}</div>
    </div>
    <div class="panel"><div class="panel-head"><h2>Планирование поставок</h2><p>Правило: если остатка хватит меньше чем на ${set.stockWarn} дн. и товар не в группе C по прибыли (или по выручке, если прибыль не посчитана) — пора поставлять. Объём = скорость × ${set.supplyDays} дн. − остаток − товары в пути.</p></div>
      ${table('stock', [
        { key: 'name', label: 'Товар', sticky: 1, val: s => s.name, cell: nameCell },
        { key: 'avail', label: 'Остаток, шт', num: 1, val: s => s.stock.available, fmt: v => num(v) },
        { key: 'in', label: 'В пути, шт', num: 1, val: s => s.stock.inbound, fmt: v => num(v) },
        { key: 'vel', label: 'Продаж в день', num: 1, val: s => s.stock.vel, fmt: v => num(v, 2) },
        { key: 'days', label: 'Хватит, дн.', num: 1, val: s => s.stock.days, fmt: v => ok(v) ? num(v) : '—' },
        { key: 'date', label: 'Обнулится', num: 1, val: s => s.stock.runOut, fmt: v => v ? isoToRu(v) : '—' },
        { key: 'status', label: 'Статус', val: s => ({ crit: 0, warn: 1, ok: 2, nosales: 3, unknown: 4 })[s.stock.status], fmt: (v, s) => statusPill(s.stock.status) },
        { key: 'abc', label: 'ABC', val: s => s.abcProfit || s.abcRevenue || null, fmt: v => v || '—' },
        { key: 'liq', label: 'Статус Ozon', val: s => s.stock.liquidity || null, fmt: v => esc(v || '—') },
        { key: 'fee', label: 'Плата за размещение в день', num: 1, val: s => s.stock.fee, fmt: v => v ? rub(v) : '—' },
        { key: 'adv', label: 'Рекомендация', val: s => s.stock.advice.text, cell: s => `<td style="min-width:240px"><span class="pill ${s.stock.advice.level}" style="white-space:normal">${esc(s.stock.advice.text)}</span></td>` }],
        list, { sort: { key: 'days', dir: 1 } })}</div></div>`;
  mkChart('chStock', {
    type: 'bar',
    data: { labels: buckets.map(b => b[0] + ' дн.'), datasets: [{ data: bc, backgroundColor: [css('--neg'), css('--warn'), css('--accent'), css('--pos'), css('--faint')], borderRadius: 4 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => nTov(c.raw) } } }, scales: { y: { ticks: { precision: 0 } } } }
  });
}

        { key: 'w', label: 'Замечания', nosort: 1, cell: d => `<td class="small ${d.warnings?.length ? 'warn' : 'faint'}" style="max-width:320px">${d.warnings?.length ? d.warnings.map(esc).join('<br>') : 'нет'}</td>` },
        { key: 'del', label: '', nosort: 1, cell: d => d.source === 'api' ? '<td class="small faint">обновляется сам</td>' : `<td><button class="btn small danger" data-del-ds="${d.id}">Удалить</button></td>` }], ds, { sort: { key: 'type', dir: 1 } }) : stub('Отчёты ещё не загружены.')}</div>
    <div class="panel"><div class="panel-head"><h2>Удержания Ozon и налог</h2><p>Точные суммы удержаний по SKU даёт отчёт по начислениям — если он загружен, ставки ниже используются лишь для товаров, которых в нём нет. Ставки нужны, только если работаете по отчёту о реализации, где удержаний нет. Посмотрите свои тарифы в личном кабинете и введите их — расчёты по ставкам помечаются как оценка.</p></div>
      <div class="form-row">
        ${rateInput('commission', 'Комиссия', '% выручки')}${rateInput('acquiring', 'Эквайринг', '% выручки')}${rateInput('logistics', 'Логистика', '₽ за шт')}
        ${rateInput('storage', 'Хранение', '₽ за шт')}${rateInput('other', 'Прочие услуги', '₽ за шт')}${rateInput('tax', 'Налог', '% от суммы реализации')}
        <button class="btn primary" id="ratesSave">${R.configured ? 'Обновить ставки' : 'Применить ставки'}</button>
        ${R.configured ? '<button class="btn small" id="ratesOff">Не использовать ставки</button>' : ''}
      </div>
      <p class="small muted" style="margin-top:10px">${R.configured ? 'Ставки применяются. Пустое поле считается нулём.' : 'Ставки не применены: пока не загружен отчёт по начислениям, прибыль не считается.'} Налог считается от суммы реализации за вычетом возвратов — без баллов за скидки и программ партнёров (например, 6% для УСН «Доходы»); если поле пустое — прибыль показывается без налога.</p></div>
    <div class="panel"><div class="panel-head"><h2>Категории и комиссия по категориям</h2><p>Категория подставляется из названия товара. Её можно переименовать — товары с одинаковым названием категории объединятся. Комиссия категории перекрывает общую ставку.</p></div>
      ${skus.length ? table('catsEdit', [
        { key: 'name', label: 'Товар', sticky: 1, val: s => s.name, cell: nameCell },
        { key: 'cat', label: 'Категория', val: s => s.category, cell: s => `<td><input type="text" data-cat="${s.sku}" value="${esc(s.category)}" style="width:180px">${S.categories[s.sku] ? ' <span class="src manual">вручную</span>' : ''}</td>` }],
        skus, { sort: { key: 'cat', dir: 1 } }) : stub('Нет товаров.')}
      ${M.cats.length ? `<div class="form-row" style="margin-top:14px">${M.cats.map(c => `<label>Комиссия «${esc(c.name)}», %<input type="number" step="0.1" min="0" data-catcomm="${esc(c.name)}" value="${S.settings.catCommission[c.name] ?? ''}" placeholder="как общая"></label>`).join('')}</div>` : ''}</div>
    <div class="panel"><div class="panel-head"><h2>Ориентир ДРР</h2></div>
      <div class="form-row"><label>Нижняя граница, %<input type="number" min="0" id="drrLow" value="${S.settings.drrLow}"></label><label>Верхняя граница, %<input type="number" min="0" id="drrHigh" value="${S.settings.drrHigh}"></label></div></div>
    <div class="panel"><div class="panel-head"><h2>Резервная копия</h2><p>Себестоимость, категории, план, ставки и срезы можно сохранить в файл и перенести в другой браузер. Отчёты в копию не входят — их проще загрузить заново.</p></div>
      <div class="form-row"><button class="btn" id="exportBtn">Скачать настройки</button><label class="btn" for="importInput">Загрузить настройки</label><input type="file" id="importInput" accept=".json" hidden>
      <button class="btn danger" id="resetBtn">Удалить все данные</button></div></div>
  </div>`;
}

/* =====================================================================
   14. ПЕРЕСЧЁТ И ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
   Любое изменение данных (загрузка, себестоимость, настройки) вызывает
   recomputeAll(): модель строится заново, перерисовываются KPI и активная вкладка.
   ===================================================================== */
const RENDER = { overview: renderOverview, plan: renderPlan, units: renderUnits, products: renderProducts, ads: renderAds, stock: renderStock, data: renderData };
function recomputeAll() {
  try { S.model = buildModel(S.period); }
  catch (e) { console.error(e); toast('Ошибка расчёта: ' + e.message, 'err'); return; }
  renderHeader(); renderKPI(); renderTab();
}
function renderTab() {
  const t = S.ui.tab;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $$('.tab').forEach(s => s.hidden = s.id !== 'tab-' + t);
  try { RENDER[t](); } catch (e) { console.error(e); $('#tab-' + t).innerHTML = stub('Не удалось отрисовать раздел: ' + esc(e.message)); }
}
function goTab(t) { S.ui.tab = t; renderTab(); }

/* ---------- уведомления и модальные окна ---------- */
function toast(msg, kind = '') {
  const d = document.createElement('div'); d.className = 'toast ' + kind; d.textContent = msg;
  $('#toasts').appendChild(d); setTimeout(() => d.remove(), kind === 'err' ? 9000 : 5000);
}
function showErrors(list) {
  const hard = list.filter(e => !e.soft), soft = list.filter(e => e.soft);
  if (!list.length) { $('#errors').innerHTML = ''; return; }
  $('#errors').innerHTML = (hard.length ? `<div class="errbox"><button class="x" aria-label="Закрыть" data-close-err>×</button><b>${hard.length === 1 ? 'Файл не загружен' : 'Не загружены файлы: ' + hard.length}</b><ul>${hard.map(e => `<li>${esc(e.msg)}</li>`).join('')}</ul></div>` : '')
    + (soft.length ? `<div class="errbox" style="background:var(--warn-soft);border-color:rgba(232,176,75,.4)"><button class="x" aria-label="Закрыть" data-close-err>×</button><b>Загружено с замечаниями</b><ul>${soft.map(e => `<li>«${esc(e.file)}»: ${esc(e.msg)}</li>`).join('')}</ul></div>` : '');
}
function askModal(title, html, buttons) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(title)}</h2><p>${html}</p><div class="modal-actions">${buttons.map(([v, l, c]) => `<button class="btn ${c}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
    m.hidden = false; m.querySelector('button').focus();
    m.onclick = e => { const b = e.target.closest('[data-v]'); if (b) { m.hidden = true; m.innerHTML = ''; res(b.dataset.v); } };
  });
}
function waitLibs(ms = 8000) { return new Promise(r => { const t0 = Date.now(); (function p() { if (window.XLSX || Date.now() - t0 > ms) r(); else setTimeout(p, 150); })(); }); }

/* ---------- обработчики событий (делегирование) ---------- */
function setCost(sku, raw) {
  const v = parseNum(raw);
  if (raw === '' || raw == null) delete S.costs[sku];
  else if (v == null || v < 0) { toast('Себестоимость должна быть числом не меньше нуля', 'err'); return; }
  else S.costs[sku] = { v, ts: new Date().toISOString() };
  save.costs(); recomputeAll();
}
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('.tabs button'); if (tab) return goTab(tab.dataset.tab);
  const th = t.closest('th[data-sort]');
  if (th) { const id = th.closest('table').dataset.tid, k = th.dataset.sort, cur = S.ui.sort[id]; S.ui.sort[id] = { key: k, dir: cur && cur.key === k ? -cur.dir : -1 }; return renderTab(); }
  if (t.closest('[data-close-err]')) return t.closest('.errbox').remove();
  const gt = t.closest('[data-goto-tab]'); if (gt) return goTab(gt.dataset.gotoTab);
  const gc = t.closest('[data-goto-cost]');
  if (gc) { e.stopPropagation(); goTab('units'); const inp = document.getElementById('cost-' + gc.dataset.gotoCost); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } return; }
  const rc = t.closest('[data-reset-cost]'); if (rc) { delete S.costs[rc.dataset.resetCost]; save.costs(); return recomputeAll(); }
  const pm = t.closest('[data-plan-month]'); if (pm) { S.plan.month = pm.dataset.planMonth; save.plan(); return renderPlan(); }
  const dsn = t.closest('[data-del-snap]'); if (dsn) { S.snapshots = S.snapshots.filter(s => s.ts !== dsn.dataset.delSnap); save.snapshots(); return renderOverview(); }
  const dd = t.closest('[data-del-ds]');
  if (dd) { const d = S.datasets.find(x => x.id === dd.dataset.delDs); askModal('Удалить отчёт?', `«${esc(d.fileName)}» будет удалён из браузера. Себестоимость и настройки сохранятся.`, [['yes', 'Удалить', 'danger'], ['no', 'Отмена', '']]).then(v => { if (v === 'yes') { S.datasets = S.datasets.filter(x => x !== d); save.datasets(); recomputeAll(); } }); return; }
  if (t.closest('input,select,button,label,a')) return;
  const ex = t.closest('[data-expand]');
  if (ex) { const k = +ex.dataset.expand; S.ui.expanded.has(k) ? S.ui.expanded.delete(k) : S.ui.expanded.add(k); renderProductsTable(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input[data-cost],input[data-cat],input[data-rate]')) e.target.blur();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-expand]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.matches('label.btn')) e.target.click();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fileInput') { ingestFiles(t.files).finally(() => t.value = ''); return; }
  if (t.id === 'periodSel') { S.period = t.value; save.period(); S.ui.expanded.clear(); return recomputeAll(); }
  if (t.dataset.cost) return setCost(+t.dataset.cost, t.value.trim());
  if (t.dataset.cat) { const v = t.value.trim(); if (v) S.categories[t.dataset.cat] = v; else delete S.categories[t.dataset.cat]; save.categories(); return recomputeAll(); }
  if (t.dataset.catcomm !== undefined) { const v = parseNum(t.value); if (v == null) delete S.settings.catCommission[t.dataset.catcomm]; else S.settings.catCommission[t.dataset.catcomm] = v; save.settings(); return recomputeAll(); }
  if (['thCrit', 'thWarn', 'thSupply', 'drrLow', 'drrHigh'].includes(t.id)) {
    const v = parseNum(t.value); if (v == null || v < 0) return toast('Введите число', 'err');
    const key = { thCrit: 'stockCrit', thWarn: 'stockWarn', thSupply: 'supplyDays', drrLow: 'drrLow', drrHigh: 'drrHigh' }[t.id];
    S.settings[key] = v;
    if (S.settings.stockWarn < S.settings.stockCrit) { S.settings.stockWarn = S.settings.stockCrit; toast('Порог «внимание» не может быть меньше критичного — выровнял', ''); }
    save.settings(); return recomputeAll();
  }
  if (t.dataset.planCat) { const c = t.dataset.planCat; S.plan.cats ||= {}; S.plan.cats[c] ||= {}; S.plan.cats[c][t.dataset.f] = parseNum(t.value); save.plan(); return renderPlan(); }
  if (t.id === 'uCat' || t.id === 'uSrc') { S.ui.filters.units[t.id === 'uCat' ? 'cat' : 'src'] = t.value; return renderUnitsTable(); }
  if (t.id === 'pCat') { S.ui.filters.products.cat = t.value; return renderProductsTable(); }
  if (t.id === 'importInput') { importSettings(t.files[0]).finally(() => t.value = ''); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'uQ') { S.ui.filters.units.q = e.target.value; renderUnitsTable(); }
  if (e.target.id === 'pQ') { S.ui.filters.products.q = e.target.value; renderProductsTable(); }
});
document.addEventListener('click', e => {
  const id = e.target.id;
  if (id === 'planSave') {
    S.plan.month = $('#planMonth').value || todayISO().slice(0, 7);
    S.plan.revenue = parseNum($('#planRev').value); S.plan.profit = parseNum($('#planProfit').value);
    save.plan(); toast('План сохранён', 'ok'); renderPlan();
  }
  if (id === 'ratesSave') {
    $$('[data-rate]').forEach(i => S.settings.rates[i.dataset.rate] = parseNum(i.value));
    S.settings.rates.configured = true; save.settings(); toast('Ставки применены, прибыль пересчитана', 'ok'); recomputeAll();
  }
  if (id === 'ratesOff') { S.settings.rates.configured = false; save.settings(); recomputeAll(); }
  if (id === 'snapBtn') {
    const M = S.model; if (!M?.have.sales) return toast('Нечего сохранять: за выбранный период нет отчёта о продажах', 'err');
    const T = M.totals;
    S.snapshots.push({ ts: new Date().toISOString(), period: S.period, label: S.period === 'all' ? 'все данные' : monthLabel(S.period), revenue: T.net, profit: T.profit, margin: T.margin, drr: M.have.ads ? T.drr : null, knownShare: T.net ? T.knownNet / T.net : null });
    save.snapshots(); toast('Срез сохранён — он появится на графике тренда во вкладке «Обзор»', 'ok');
    if (S.ui.tab === 'overview') renderOverview();
  }
  if (id === 'exportBtn') {
    const blob = new Blob([JSON.stringify({ app: 'ozon-dashboard', v: 1, costs: S.costs, categories: S.categories, settings: S.settings, plan: S.plan, snapshots: S.snapshots }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ozon-dashboard-settings-${todayISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  if (id === 'resetBtn') askModal('Удалить все данные?', 'Будут удалены отчёты, себестоимость, категории, план, ставки и срезы. Это нельзя отменить.', [['yes', 'Удалить всё', 'danger'], ['no', 'Отмена', '']]).then(v => {
    if (v !== 'yes') return;
    Object.keys(localStorage).filter(k => k.startsWith('ozd_')).forEach(k => localStorage.removeItem(k));
    Object.assign(S, { datasets: [], costs: {}, categories: {}, settings: loadSettings(), plan: { month: todayISO().slice(0, 7), revenue: null, profit: null, cats: {} }, snapshots: [], period: 'all' });
    showErrors([]); recomputeAll();
  });
});
async function importSettings(file) {
  if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'ozon-dashboard') throw new Error('это не файл настроек дашборда');
    S.costs = j.costs || {}; S.categories = j.categories || {}; S.plan = j.plan || S.plan; S.snapshots = j.snapshots || [];
    S.settings = { ...DEFAULT_SETTINGS, ...(j.settings || {}), rates: { ...DEFAULT_SETTINGS.rates, ...(j.settings?.rates || {}) } };
    ['costs', 'categories', 'plan', 'snapshots', 'settings'].forEach(k => save[k]());
    toast('Настройки загружены', 'ok'); recomputeAll();
  } catch (e) { toast('Не удалось загрузить настройки: ' + e.message, 'err'); }
}
/* перетаскивание файлов на страницу */
let dragDepth = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop').hidden = true; if (e.dataTransfer?.files?.length) ingestFiles(e.dataTransfer.files); });

/* =====================================================================
   15. ДАННЫЕ ИЗ OZON API
   Открытая с сервера BrandOS (адрес /ozon), страница сама получает отчёты из Ozon API:
   начисления за 3 месяца, остатки на сегодня и рекламу из Ozon Performance — в тех же формах,
   что и при разборе выгрузок. Ключи хранятся только на сервере (.env), в браузер не попадают.
   Открытая просто как файл, страница работает по-старому — на загруженных выгрузках.
   Если за тот же месяц загружен файл того же типа, берётся файл, а данные API за этот месяц пропускаются.
   ===================================================================== */
const API_URL = /^https?:$/.test(location.protocol);
S.api = null;   // {seller:{on,at,error}, perf:{…}, lastSync, syncing, skipped:[]}
const apiOn = () => !!(S.api && (S.api.seller.on || S.api.perf.on));
const timeRu = iso => { const d = new Date(iso); return `${isoToRu(isoOf(d))} в ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

async function loadFromApi({ quiet = true } = {}) {
  if (!API_URL) return false;
  let j;
  try {
    const r = await fetch('/api/ozon/reports', { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { location.href = '/login'; return false; }
    if (!r.ok) return false;   // страница открыта не с сервера BrandOS
    j = await r.json();
  } catch (e) { if (!quiet) toast('Сервер не ответил: ' + e.message, 'err'); return false; }
  const hadApi = S.datasets.some(d => d.source === 'api');
  const manual = S.datasets.filter(d => d.source !== 'api'), taken = [], skipped = [];
  for (const ds of j.datasets || []) {
    const clash = ds.period && manual.find(d => d.type === ds.type && overlaps(d.period, ds.period));
    if (clash) skipped.push(`${TYPE_LABEL[ds.type]} за ${monthLabel(ds.period.from.slice(0, 7)).toLowerCase()}: используется файл «${clash.fileName}»`);
    else taken.push(ds);
  }
  S.datasets = [...manual, ...taken];
  S.api = { seller: j.seller, perf: j.perf, lastSync: j.lastSync, syncing: j.syncing, skipped };
  save.datasets();
  const keys = periodKeys();
  if (!hadApi && taken.length && S.period === 'all' && keys.length) S.period = keys[keys.length - 1];
  if (S.period !== 'all' && !keys.includes(S.period)) S.period = keys[keys.length - 1] || 'all';
  save.period();
  recomputeAll();
  return true;
}

async function refreshFromOzon() {
  const b = $('#apiBtn'); b.disabled = true; b.textContent = 'Обновляю…';
  try {
    const r = await fetch('/api/sync', { method: 'POST', credentials: 'same-origin' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'ошибка ' + r.status);
    for (let i = 0; i < 120; i++) {   // ждём до 6 минут: у Ozon строгие лимиты, синхронизация небыстрая
      await new Promise(res => setTimeout(res, 3000));
      const st = await (await fetch('/api/status', { credentials: 'same-origin', cache: 'no-store' })).json();
      if (!st.syncing) break;
    }
    await loadFromApi({ quiet: false });
    const err = S.api?.seller.error || S.api?.perf.error;
    toast(err ? 'Обновлено с ошибкой: ' + err : 'Данные из Ozon обновлены, показатели пересчитаны', err ? 'err' : 'ok');
  } catch (e) { toast('Не удалось обновить данные из Ozon: ' + e.message, 'err'); }
  finally { b.disabled = false; b.textContent = 'Обновить из Ozon'; }
}

function apiPanel() {
  if (!S.api) return '';
  const line = (label, x, how) => !x.on
    ? `<li><b>${label}</b> — <span class="faint">не подключено. ${how}</span></li>`
    : `<li><b>${label}</b> — ${x.error ? `<span class="neg">ошибка: ${esc(x.error)}</span>` : `<span class="pos">подключено</span>`}${x.at ? `<span class="muted">, последние данные ${timeRu(x.at)}</span>` : ''}</li>`;
  return `<div class="panel"><div class="panel-head"><h2>Подключение к Ozon</h2><p>Данные подтягиваются с сервера сами: при открытии страницы, раз в 10 минут и по кнопке «Обновить из Ozon». Сервер забирает их из Ozon по расписанию. Себестоимость в API нет — её по-прежнему задаёте вручную или файлом.</p></div>
    <ul class="small" style="margin:0;padding-left:18px;line-height:1.8">
      ${line('Ozon Seller API', S.api.seller, 'Впишите OZON_CLIENT_ID и OZON_API_KEY в .env на сервере (роль ключа — Admin read only). Даёт продажи, возвраты, удержания Ozon и остатки.')}
      ${line('Ozon Performance API', S.api.perf, 'Реклама берётся из начислений кабинета продавца: расход по видам продвижения и по товарам (оплата за заказ), без показов и кликов. Чтобы были показы, клики и кампании, впишите OZON_PERF_CLIENT_ID и OZON_PERF_CLIENT_SECRET из performance.ozon.ru.')}
    </ul>
    ${S.api.skipped.length ? `<p class="small warn" style="margin-top:10px">Вместо данных API используются загруженные файлы:<br>${S.api.skipped.map(esc).join('<br>')}<br>Удалите файл, чтобы данные за этот месяц шли из API.</p>` : ''}</div>`;
}
document.addEventListener('click', e => { if (e.target.id === 'apiBtn') refreshFromOzon(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && apiOn()) loadFromApi(); });
setInterval(() => { if (apiOn() && !document.hidden) loadFromApi(); }, 10 * 60 * 1000);

/* ---------- старт ---------- */
recomputeAll();
loadFromApi();
if (!window.Chart) waitLibs().then(() => setTimeout(() => { if (window.Chart) renderTab(); }, 600));
</script>
</body>
</html>
