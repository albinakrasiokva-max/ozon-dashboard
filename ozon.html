<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аналитика магазина на Ozon</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Библиотеки: SheetJS (чтение Excel) и Chart.js (графики). При недоступности cdnjs — запасной jsDelivr. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
        onerror="this.remove();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"
        onerror="this.remove();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js';document.head.appendChild(s)"></script>
<style>
:root{
  --bg:#17151F; --surface:#201D2A; --raised:#2A2636; --line:#383347; --line-soft:#2C2839;
  --text:#EEEAF4; --muted:#A49EB4; --faint:#716A84;
  --accent:#9AA8FF; --accent-soft:rgba(154,168,255,.14);
  --pos:#5CC9A7; --pos-soft:rgba(92,201,167,.14);
  --warn:#E8B04B; --warn-soft:rgba(232,176,75,.14);
  --neg:#EE7B6B; --neg-soft:rgba(238,123,107,.14);
  --r-lg:14px; --r-md:9px; --r-sm:5px;
  --font:"Onest", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:19px;line-height:1.3}
h3{font-size:16px}
h4{font-size:14px;color:var(--muted);font-weight:500}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.num{text-align:right;white-space:nowrap}

/* ---------- шапка ---------- */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding:22px clamp(16px,3vw,36px) 14px}
.brand h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
.brand .sub{color:var(--muted);font-size:13px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.period{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select,input[type=number],input[type=text],input[type=search],input[type=month]{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;min-height:36px}
input[type=number]{width:110px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);color:#16142A;border-color:var(--accent)}
.btn.primary:hover{background:#B3BDFF}
.btn.small{padding:4px 12px;min-height:30px;font-size:13px}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- KPI-строка ---------- */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:0 clamp(16px,3vw,36px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi .k{padding:14px 16px 14px 0;border-right:1px solid var(--line-soft);padding-left:16px}
.kpi .k:first-child{padding-left:0}
.kpi .k:last-child{border-right:0}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:25px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:2px}
.kpi .note{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.cover{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:8px}
.cover span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:5px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.gray{background:var(--raised);color:var(--muted)}

/* ---------- вкладки ---------- */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:0 clamp(16px,3vw,36px);border-bottom:1px solid var(--line);scrollbar-width:none;padding-top:env(safe-area-inset-top,0px)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 12px 11px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--text)}
main{padding:22px clamp(16px,3vw,36px) 60px;max-width:1500px}
.tab[hidden]{display:none}

/* ---------- блоки ---------- */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:18px 20px}
.stack > * + *{margin-top:16px}
.panel-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.panel-head p{font-size:13px;color:var(--muted);max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.chartbox{position:relative;height:300px}
.chartbox.short{height:230px}
.stub{border:1px dashed var(--line);border-radius:var(--r-md);padding:16px 18px;color:var(--muted);font-size:14px;line-height:1.5}
.stub b{color:var(--text);font-weight:500}

/* автовыводы */
.insights{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.insights li{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:start;line-height:1.5;max-width:92ch}
.insights li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--faint)}
.insights li.pos::before{background:var(--pos)} .insights li.neg::before{background:var(--neg)} .insights li.warn::before{background:var(--warn)} .insights li.acc::before{background:var(--accent)}
.insights li{color:var(--text)}

/* ---------- таблицы ---------- */
.tbl{overflow:auto;max-height:640px;border:1px solid var(--line-soft);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{position:sticky;top:0;background:var(--raised);text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;white-space:nowrap;z-index:2}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--text)}
th[aria-sort=ascending]::after{content:" ↑"} th[aria-sort=descending]::after{content:" ↓"}
th.num{text-align:right}
td.name{min-width:240px;max-width:340px}
td.name .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.name .a{font-size:12px;color:var(--faint)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(255,255,255,.025)}
tr.open td{background:var(--raised)}
tr.detail > td{background:#1C1926;padding:16px}
tfoot td{font-weight:600;background:var(--raised);position:sticky;bottom:0}
.sticky-col{position:sticky;left:0;background:var(--surface);z-index:1}
th.sticky-col{z-index:3;background:var(--raised)}
.cost-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:150px}
.cost-cell input{width:84px;min-height:30px;padding:4px 8px}
.src{font-size:11.5px;border-radius:4px;padding:1px 6px;white-space:nowrap}
.src.report{color:var(--accent);background:var(--accent-soft)}
.src.manual{color:var(--warn);background:var(--warn-soft)}
.src.none{color:var(--neg);background:var(--neg-soft)}
.src.rates{color:var(--muted);background:var(--raised)}
.nodata{color:var(--neg);font-size:12.5px;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.filters input[type=search]{min-width:240px}

/* деталь товара */
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.wf-row{display:grid;grid-template-columns:130px 1fr 92px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.wf-bar{height:10px;border-radius:2px;background:var(--neg);opacity:.85}
.wf-bar.plus{background:var(--accent)} .wf-bar.res{background:var(--pos)} .wf-bar.res.neg{background:var(--neg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}

/* воронка */
.funnel{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center}
.fbar{height:26px;border-radius:4px;background:var(--accent-soft);position:relative}
.fbar span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;opacity:.75}
.fconv{font-size:12.5px;color:var(--muted);padding-left:162px;margin-top:-4px}

/* план-факт */
.pbar{position:relative;height:14px;border-radius:7px;background:var(--line);margin:10px 0 6px}
.pbar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;max-width:100%}
.pbar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--text)}
.pbar .mark::after{content:attr(data-l);position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.bigpair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bigpair .v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.form-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.form-row label{display:grid;gap:4px;font-size:13px;color:var(--muted)}

/* уведомления */
#errors{margin:0 clamp(16px,3vw,36px)}
.errbox{background:var(--neg-soft);border:1px solid rgba(238,123,107,.4);border-radius:var(--r-md);padding:12px 16px;margin-bottom:12px;font-size:14px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.errbox li + li{margin-top:4px}
.errbox .x{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.err{border-left-color:var(--neg)} .toast.ok{border-left-color:var(--pos)}
#modal{position:fixed;inset:0;background:rgba(10,8,16,.7);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
#modal[hidden]{display:none}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;max-width:560px;width:100%}
.modal-card p{margin-top:10px;color:var(--muted);font-size:14px}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
#drop{position:fixed;inset:0;border:3px dashed var(--accent);background:rgba(23,21,31,.85);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:80;pointer-events:none}
#drop[hidden]{display:none}

/* пустое состояние */
.empty{max-width:760px}
.empty h2{font-size:24px;margin-bottom:8px}
.reports{list-style:none;padding:0;margin:18px 0;display:grid;gap:12px}
.reports li{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line-soft)}
.reports b{font-weight:500}
@media (max-width:640px){
  .reports li{grid-template-columns:1fr;gap:2px}
  .kpi .k{padding-left:0;border-right:0;border-bottom:1px solid var(--line-soft)}
  .fstep{grid-template-columns:100px 1fr 90px}.fconv{padding-left:112px}
  .bigpair{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Аналитика магазина на Ozon</h1>
    <p class="sub" id="dataStamp">Загрузите отчёты, чтобы начать</p>
  </div>
  <div class="controls">
    <label class="period">Период <select id="periodSel" aria-label="Период"></select></label>
    <button id="apiBtn" class="btn" type="button" hidden title="Запросить свежие данные из Ozon API">Обновить из Ozon</button>
    <button id="snapBtn" class="btn" type="button" title="Сохранить ключевые показатели текущего периода для графика тренда">Сохранить срез</button>
    <label class="btn primary" for="fileInput" tabindex="0">Загрузить отчёты</label>
    <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.csv" hidden>
  </div>
</header>
<div id="errors" aria-live="polite"></div>
<section id="kpi" class="kpi" aria-label="Ключевые показатели"></section>
<nav class="tabs" role="tablist" aria-label="Разделы">
  <button role="tab" data-tab="overview" aria-selected="true">Обзор</button>
  <button role="tab" data-tab="plan">План-факт</button>
  <button role="tab" data-tab="units">Юнит-экономика</button>
  <button role="tab" data-tab="products">Товары</button>
  <button role="tab" data-tab="ads">Реклама и воронка</button>
  <button role="tab" data-tab="stock">Остатки</button>
  <button role="tab" data-tab="data">Данные и настройки</button>
</nav>
<main>
  <section class="tab" id="tab-overview" role="tabpanel"></section>
  <section class="tab" id="tab-plan" role="tabpanel" hidden></section>
  <section class="tab" id="tab-units" role="tabpanel" hidden></section>
  <section class="tab" id="tab-products" role="tabpanel" hidden></section>
  <section class="tab" id="tab-ads" role="tabpanel" hidden></section>
  <section class="tab" id="tab-stock" role="tabpanel" hidden></section>
  <section class="tab" id="tab-data" role="tabpanel" hidden></section>
</main>
<div id="drop" hidden>Отпустите файлы, чтобы загрузить отчёты</div>
<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   0. УТИЛИТЫ
   ===================================================================== */
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const nf0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ok = v => v != null && isFinite(v);
// «-0 ₽» не показываем: значения, которые округляются до нуля, выводим как 0
const rub = (v, d = 0) => ok(v) ? (d ? nf2 : nf0).format(Math.abs(v) < (d ? 0.005 : 0.5) ? 0 : v) + '\u00a0₽' : '—';
const pct = (v, d = 1) => ok(v) ? (d === 2 ? nf2 : d ? nf1 : nf0).format(v * 100) + '%' : '—';   // v — доля (0.15 = 15%)
const num = (v, d = 0) => ok(v) ? (d === 2 ? nf2 : d ? nf1 : nf0).format(v) : '—';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
function median(arr) { const a = arr.filter(ok).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }
function plural(n, one, few, many) { n = Math.abs(Math.round(n)); const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }
const nTov = n => `${n} ${plural(n, 'товар', 'товара', 'товаров')}`;

/** Число из ячейки: понимает «1 234,56», «22,00%», «−37%», «293 руб.», «-». Пустое → null. */
function parseNum(v) {
  if (v == null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[\u00a0\u202f\s]/g, '').replace(/[−–—]/g, '-').replace(/руб\.?|₽|%|шт\.?/gi, '');
  if (s === '' || s === '-') return null;
  s = s.replace(',', '.');
  if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s)) return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
/** Нормализация заголовка: нижний регистр, без неразрывных пробелов и переносов, ё→е. */
const norm = s => String(s ?? '').replace(/[\u00a0\u202f\ufffd]/g, ' ').replace(/[\r\n]+/g, ' ').replace(/ё/g, 'е').replace(/Ё/g, 'Е').replace(/\s+/g, ' ').trim().toLowerCase();

/* даты храним строками ISO 'YYYY-MM-DD' */
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const ruToISO = s => { const m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : null; };
const isoToRu = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : '—';
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); }
function daysIncl(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5) + 1; }
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const monthStart = key => `${key}-01`;
const monthEnd = key => `${key}-${pad(daysInMonth(key))}`;
const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MON_ABBR = { 'янв': 1, 'фев': 2, 'мар': 3, 'апр': 4, 'май': 5, 'мая': 5, 'июн': 6, 'июл': 7, 'авг': 8, 'сен': 9, 'окт': 10, 'ноя': 11, 'дек': 12 };
const monthLabel = key => { const [y, m] = key.split('-').map(Number); const s = MONTHS[m - 1]; return s[0].toUpperCase() + s.slice(1) + ' ' + y; };
/** Дата из ячейки: серийный номер Excel, «dd.mm.yyyy», «yyyy-mm-dd». */
function parseDateAny(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const s = String(v);
  return ruToISO(s) || (/^(\d{4}-\d{2}-\d{2})/.exec(s) || [])[1] || null;
}
/** Excel портит артикулы вида «9.6» в дату «09.июн». Возвращаем исходный вид. */
function fixArticle(a) {
  if (a == null) return '';

class UserError extends Error { }
async function readBook(file) {
  const buf = await file.arrayBuffer();
  if (/\.(csv|txt)$/i.test(file.name)) {
    return { sheets: [{ name: 'CSV', rows: parseCSV(decodeText(buf)), merges: [] }] };
  }
  if (!window.XLSX) throw new UserError('Библиотека чтения Excel (SheetJS) не загрузилась. Проверьте интернет и обновите страницу.');
  let wb;
  try { wb = XLSX.read(fixEntities(new Uint8Array(buf)), { type: 'array' }); }
  catch (e) { throw new UserError(`«${file.name}» не читается как Excel (${e.message}). Выгрузите отчёт из личного кабинета заново в формате .xlsx.`); }
  return {
    sheets: wb.SheetNames.map(n => {
      const ws = wb.Sheets[n];
      fixRange(ws);
      return { name: n, rows: ws['!ref'] ? XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, blankrows: true }) : [], merges: ws['!merges'] || [] };
    })
  };
}
/**
 * Ozon записывает кириллицу в xlsx числовыми XML-сущностями (&#x41E;), а SheetJS 0.18.5
 * декодирует их с ошибкой (кириллица превращается в мусор, неразрывные пробелы пропадают).
 * Поэтому до разбора распаковываем xlsx (это zip), заменяем сущности обычными символами
 * и собираем архив обратно. Если что-то пошло не так — отдаём исходный файл.
 */
function fixEntities(u8) {
  try {
    const cfb = XLSX.CFB.read(u8, { type: 'array' });
    let changed = false;
    cfb.FileIndex.forEach((fi, i) => {
      if (!/\.xml$/i.test(cfb.FullPaths[i]) || !fi.content || !fi.content.length) return;
      const text = new TextDecoder('utf-8').decode(Uint8Array.from(fi.content));
      if (!/&#x?[0-9a-f]+;/i.test(text)) return;
      const fixed = text.replace(/&#(x?)([0-9a-fA-F]+);/g, (m, x, h) => {
        const c = parseInt(h, x ? 16 : 10);
        return [0x26, 0x3C, 0x3E, 0x22, 0x27].includes(c) || (c < 0x20 && c !== 9 && c !== 10 && c !== 13) ? m : String.fromCodePoint(c);
      });
      fi.content = new TextEncoder().encode(fixed); fi.size = fi.content.length; changed = true;
    });
    return changed ? XLSX.CFB.write(cfb, { type: 'array', fileType: 'zip' }) : u8;
  } catch (e) { console.warn('fixEntities', e); return u8; }
}
/** Ozon иногда пишет в файл неверный размер листа (например, «A1»). Пересчитываем диапазон по реальным ячейкам. */
function fixRange(ws) {
  let mr = -1, mc = -1;
  for (const k in ws) { if (k[0] === '!') continue; const a = XLSX.utils.decode_cell(k); if (a.r > mr) mr = a.r; if (a.c > mc) mc = a.c; }
  if (mr >= 0) ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: mr, c: mc } });
}
function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^\uFEFF/, ''); }
  catch (e) { return new TextDecoder('windows-1251').decode(buf); }
}
/** CSV с автоопределением разделителя (; , табуляция) и кавычками. */
function parseCSV(text) {
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = [';', ',', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.map(r => r.map(v => v === '' ? null : v));
}

/* =====================================================================
   3. ПАРСИНГ ОТЧЁТОВ
   Для каждого типа отчёта — свои правила. Тип определяется по содержимому
   листа (набору заголовков), а не по имени файла.
   Колонки ищутся регулярными выражениями по тексту заголовка; для двухстрочных
   шапок учитывается «родитель» (объединённая ячейка сверху), например
   «Реализовано → Кол-во» и «Возвращено клиентом → Кол-во».
   ===================================================================== */

  for (let i = 0; i < Math.min(rows.length, max); i++) {

function headerInfo(sh, hRow) {

  const width = Math.max(top.length, next.length);
  const parent = Array.from({ length: width }, (_, c) => norm(top[c]));
  for (const m of sh.merges) if (m.s.r === hRow) for (let c = m.s.c; c <= m.e.c; c++) parent[c] = norm(top[m.s.c]);
  const two = isSubHeader(next);
  const cols = parent.map((p, i) => ({ i, parent: p, child: two ? norm(next[i]) : '' }));
  return { cols, dataStart: hRow + (two ? 2 : 1), two };
}
/**
 * Сопоставляет спецификацию колонок с шапкой. Обязательные колонки, которых нет,
 * дают понятную ошибку; необязательные — предупреждение.

  for (const [k, s] of Object.entries(spec)) {
    const c = h.cols.find(c => {
      const key = c.child || c.parent;
      return key && s.re.test(key) && (!s.parent || s.parent.test(c.parent)) && !(s.exclude && s.exclude.test(key));
    });
    idx[k] = c ? c.i : -1;

    `«${ctx.fileName}» похож на «${ctx.typeLabel}» (лист «${ctx.sheet}»), но в нём не найдены колонки: ${missing.map(m => '«' + m + '»').join(', ')}. ` +
    `Скорее всего, Ozon изменил формат отчёта. Правила поиска колонок описаны в блоке PARSERS в коде страницы.`);

      if (!Object.keys(items).length) throw new UserError(`«${ctx.fileName}»: в отчёте по остаткам нет строк с товарами.`);
      return { snapshotDate: snap, data: { items, cost, hasVelocity: idx.avgDaily >= 0 }, warnings: warn };
    }
  },
  /* ---------- Цены и товары (CSV/XLSX из раздела цен): цена, себестоимость, показы ---------- */
  {
    type: 'prices',
    detect: t => t.includes('ваша цена') && /\bsku\b/.test(t),
    parse(sheets, ctx, file) {
      const sh = sheets.find(s => this.detect(sheetText(s)));
      ctx.sheet = sh.name;
      const hRow = findRow(sh.rows, [/^sku$/, /^ваша цена/]);
      if (hRow < 0) throw new UserError(`«${ctx.fileName}»: не найдена строка заголовков с колонками «SKU» и «Ваша цена».`);
      const h = headerInfo(sh, hRow);
      const { idx, warn } = mapColumns(h, {
        sku: { label: 'SKU', re: /^sku$/, required: true },
        name: { label: 'Название', re: /^название/ },
        article: { label: 'Артикул', re: /^артикул$/ },
        price: { label: 'Ваша цена', re: /^ваша цена/ },
        buyerPrice: { label: 'Цена для покупателя', re: /^цена для покупателя/ },
        ordersSum: { label: 'Заказано на сумму', re: /^заказано на сумму$/ },
        impr: { label: 'Показы всего', re: /^показы всего$/ },
        conv: { label: 'Конверсия из показа в заказ', re: /^конверсия из показа в заказ$/ },
        ordersQty: { label: 'Заказано товаров', re: /^заказано товаров$/ }
      }, ctx);
      const g = getter(idx), costCol = costFromRow(h), items = {}, cost = {};
      for (let i = h.dataStart; i < sh.rows.length; i++) {
        const r = sh.rows[i]; if (!r) continue;
        const sku = isSku(g(r, 'sku')); if (!sku) continue;
        const n = k => parseNum(g(r, k));
        items[sku] = { sku, name: String(g(r, 'name') ?? ''), article: fixArticle(g(r, 'article')), price: n('price'), buyerPrice: n('buyerPrice'), ordersSum: n('ordersSum'), impr: n('impr'), conv: n('conv') != null ? n('conv') / 100 : null, ordersQty: n('ordersQty') };
        if (costCol >= 0) { const c = parseNum(r[costCol]); if (c > 0) cost[sku] = c; }
      }
      if (!Object.keys(items).length) throw new UserError(`«${ctx.fileName}»: в файле цен нет строк с товарами.`);
      return { snapshotDate: isoOf(new Date(file.lastModified || Date.now())), data: { items, cost }, warnings: warn };
    }
  },
  /* ---------- Отчёт по начислениям (Финансы → Начисления → выгрузка) ----------
     Проверено на реальной выгрузке Ozon за август 2026 (лист «Начисления»):
     строка 1 — «Период: 01.08.2026-31.08.2026», строка 2 — шапка:
     ID начисления | Дата начисления | Группа услуг | Тип начисления | Артикул | SKU | Название товара |
     Количество | Цена продавца | … | Вознаграждение Ozon, % | … | Сумма итого, руб.
     Каждая строка — одна операция. Отсюда берём ВСЁ: выручку, возвраты и удержания Ozon.
     Выручка по цене продавца = «Продажи → Выручка» + «Баллы за скидки» + «Программы партнёров»
     (баллы — это часть цены, которую Ozon доплачивает за покупателя; в отчёте о реализации их нет). */
  {
    type: 'accruals',
    detect: t => /(тип начисления|группа услуг)/.test(t) && /сумма итого/.test(t),
    parse(sheets, ctx) {
      const sh = sheets.find(s => this.detect(sheetText(s)));
      ctx.sheet = sh.name;
      const hRow = findRow(sh.rows, [/^группа услуг$/, /^тип начисления$/]);
      if (hRow < 0) throw new UserError(`«${ctx.fileName}»: не найдена строка заголовков с колонками «Группа услуг» и «Тип начисления».`);
      const h = headerInfo(sh, hRow);
      const { idx, warn } = mapColumns(h, {
        id: { label: 'ID начисления', re: /^id начисления/ },
        date: { label: 'Дата начисления', re: /^дата начисления/, required: true },
        group: { label: 'Группа услуг', re: /^группа услуг/, required: true },
        type: { label: 'Тип начисления', re: /^тип начисления/, required: true },
        article: { label: 'Артикул', re: /^артикул/ },
        sku: { label: 'SKU', re: /^sku$/, required: true },
        name: { label: 'Название товара', re: /^название товара/ },
        qty: { label: 'Количество', re: /^количество/, required: true },
        total: { label: 'Сумма итого, руб.', re: /^сумма итого/, required: true }
      }, ctx);
      const g = getter(idx), items = {}, unassigned = blankFees();
      const adsByCamp = {}; let adsSub = 0, adsOther = 0;
      const byType = {};   // сводка «группа → тип → сумма» для сверки с кабинетом
      let dmin = null, dmax = null;
      for (let i = h.dataStart; i < sh.rows.length; i++) {
        const r = sh.rows[i]; if (!r) continue;
        const total = parseNum(g(r, 'total')); if (total == null) continue;
        const group = norm(g(r, 'group')), type = norm(g(r, 'type'));
        if (!group && !type) continue;   // строки итогов
        const d = parseDateAny(g(r, 'date')); if (d) { if (!dmin || d < dmin) dmin = d; if (!dmax || d > dmax) dmax = d; }
        const key = `${g(r, 'group') ?? ''} → ${g(r, 'type') ?? ''}`; byType[key] = (byType[key] || 0) + total;
        const cls = classifyAccrual(group, type);
        const sku = isSku(g(r, 'sku'));
        if (cls === 'ads') {   // расходы на продвижение идут без SKU, с ID кампании в колонке «ID начисления»
          if (/подписк/.test(type)) adsSub += -total;
          else if (sku) { (items[sku] ||= newAccItem(sku)).fees.ads += -total; }
          else { const c = String(g(r, 'id') ?? '').trim(); if (c) adsByCamp[c] = (adsByCamp[c] || 0) - total; else adsOther += -total; }
          continue;
        }
        if (!sku) { if (cls === 'sale' || cls === 'return') continue; unassigned[cls] += -total; continue; }
        const it = items[sku] ||= newAccItem(sku);
        it.name ||= String(g(r, 'name') ?? ''); it.article ||= fixArticle(g(r, 'article'));
        const q = parseNum(g(r, 'qty')) || 0;
        if (cls === 'sale') {
          if (/^выручка$/.test(type)) { it.sold.soldAmt += total; it.sold.soldQty += q; } else it.sold.soldLoyal += total;
        } else if (cls === 'return') {
          if (/возврат выручки/.test(type)) { it.sold.retAmt += -total; it.sold.retQty += q; } else it.sold.retLoyal += -total;
        } else it.fees[cls] += -total;   // удержания в отчёте отрицательные → храним расходы положительными
      }
      const pm = /(\d{2}\.\d{2}\.\d{4})\s*[-–—]\s*(\d{2}\.\d{2}\.\d{4})/.exec((sh.rows.slice(0, hRow).flat().filter(Boolean).join(' ')));
      const period = pm ? { from: ruToISO(pm[1]), to: ruToISO(pm[2]) } : dmin ? { from: dmin, to: dmax } : null;
      if (!period) throw new UserError(`«${ctx.fileName}»: не найден период отчёта — нет ни строки «Период: …», ни дат начислений.`);
      const hasSales = Object.values(items).some(it => it.sold.soldQty > 0);
      if (!hasSales) warn.push('в отчёте нет строк «Продажи → Выручка» — выручка будет взята из отчёта о реализации, если он загружен');
      return { period, data: { items, unassigned, adsByCamp, adsSub, adsOther, hasSales, byType }, warnings: warn };
    }
  },
  /* ---------- Любая таблица с себестоимостью по SKU/артикулу (управленческий учёт) ---------- */
  {
    type: 'costs',
    detect: t => /(\bsku\b|артикул)/.test(t) && COST_RE.test(t),
    parse(sheets, ctx, file) {
      const sh = sheets.find(s => this.detect(sheetText(s)));
      ctx.sheet = sh.name;
      const hRow = findRow(sh.rows, [/(^sku$|^артикул)/, COST_RE]);
      if (hRow < 0) throw new UserError(`«${ctx.fileName}»: не найдена строка с заголовками «SKU/Артикул» и «Себестоимость».`);
      const h = headerInfo(sh, hRow);
      const skuCol = h.cols.find(c => /^sku$/.test(c.child || c.parent))?.i ?? -1;
      const artCol = h.cols.find(c => /^артикул/.test(c.child || c.parent))?.i ?? -1;
      const costCol = costFromRow(h);
      if (costCol < 0) throw new UserError(`«${ctx.fileName}»: не найдена колонка с себестоимостью (ищем «себестоимость», «закупочная цена», «cost»).`);
      const cost = {}, byArticle = {};
      for (let i = h.dataStart; i < sh.rows.length; i++) {
        const r = sh.rows[i]; if (!r) continue;
        const c = parseNum(r[costCol]); if (!(c > 0)) continue;
        const sku = skuCol >= 0 ? isSku(r[skuCol]) : null;
        if (sku) cost[sku] = c; else if (artCol >= 0 && r[artCol] != null) byArticle[fixArticle(r[artCol])] = c;
      }
      if (!Object.keys(cost).length && !Object.keys(byArticle).length) throw new UserError(`«${ctx.fileName}»: колонка себестоимости найдена, но значений в ней нет.`);
      return { snapshotDate: isoOf(new Date(file.lastModified || Date.now())), data: { items: {}, cost, byArticle }, warnings: [] };
    }
  }
];
function blankFees() { return { commission: 0, acquiring: 0, logistics: 0, storage: 0, penalties: 0, other: 0, ads: 0 }; }
function newAccItem(sku) { return { sku, name: '', article: '', fees: blankFees(), sold: { soldQty: 0, retQty: 0, soldAmt: 0, soldLoyal: 0, retAmt: 0, retLoyal: 0 } }; }
/** Раскладка строки начислений по статьям: сначала по «Группе услуг», затем по ключевым словам «Типа начисления». */
function classifyAccrual(group, type) {
  const t = group + ' ' + type;
  if (/^продажи/.test(group)) return 'sale';
  if (/^возвраты/.test(group)) return 'return';
  if (/^вознаграждение ozon/.test(group) || /(вознагражд|комисс)/.test(type)) return 'commission';
  if (/эквайр/.test(t)) return 'acquiring';
  if (/(продвиж|реклам|трафарет|оплата за клик|оплата за заказ|подписка premium)/.test(t)) return 'ads';
  if (/(штраф|неустой|нарушен)/.test(t)) return 'penalties';
  if (/(хранен|размещен)/.test(type)) return 'storage';
  if (/(логист|доставк|магистрал|последн.*мил|обработк.*возврат|кросс-?док|перемещ)/.test(type)) return 'logistics';
  return 'other';   // упаковка, страхование, компенсации (плюсом) и всё новое
}

/** Разбор одного файла: определяет тип по содержимому и вызывает нужный парсер. */
async function parseFile(file) {
  const book = await readBook(file);
  const texts = book.sheets.map(s => sheetText(s));
  const parser = PARSERS.find(p => texts.some(t => p.detect(t)));
  if (!parser) {
    throw new UserError(`«${file.name}»: не удалось определить тип отчёта по заголовкам. Поддерживаются: отчёт о реализации (колонки «SKU», «Реализовано», «Возвращено клиентом»), аналитика продвижения («SKU», «ID кампании», «Расход, ₽», «Показы»), управление остатками («SKU», «Доступно к продаже»), цены («SKU», «Ваша цена»), отчёт по начислениям («Группа услуг», «Тип начисления», «Сумма итого, руб.») и таблица себестоимости («SKU» или «Артикул» + «Себестоимость»).`);
  }
  const ctx = { fileName: file.name, typeLabel: TYPE_LABEL[parser.type], sheet: '' };
  const res = parser.parse(book.sheets, ctx, file);
  return { id: uid(), type: parser.type, fileName: file.name, loadedAt: new Date().toISOString(), period: res.period || null, snapshotDate: res.snapshotDate || null, data: res.data, warnings: res.warnings || [] };
}

<script>
/* =====================================================================
   4. ЗАГРУЗКА: объединение с уже загруженными данными, конфликты периодов
   ===================================================================== */
const overlaps = (a, b) => a && b && a.from <= b.to && b.from <= a.to;

async function ingestFiles(fileList) {
  const files = [...fileList]; if (!files.length) return;
  if (!window.XLSX && files.some(f => !/\.csv$/i.test(f.name))) { await waitLibs(); }
  const errors = [], added = [];
  for (const file of files) {
    try {
      const ds = await parseFile(file);
      const decision = await resolveConflict(ds);
      if (decision === 'cancel') continue;
      added.push(`${TYPE_LABEL[ds.type]}${ds.period ? ' за ' + isoToRu(ds.period.from) + '–' + isoToRu(ds.period.to) : ''}`);
      ds.warnings.forEach(w => errors.push({ file: file.name, msg: w, soft: true }));
    } catch (e) {
      console.error(e);
      errors.push({ file: file.name, msg: e instanceof UserError ? e.message : `«${file.name}»: непредвиденная ошибка при разборе (${e.message}). Файл не загружен, остальные данные не затронуты.` });
    }
  }
  save.datasets();
  // Если выбранного периода больше нет среди доступных — переключаемся на самый свежий месяц.
  const keys = periodKeys();
  if (S.period !== 'all' && !keys.includes(S.period)) { S.period = keys[keys.length - 1] || 'all'; save.period(); }
  if (added.length && S.period === 'all' && keys.length === 1) { S.period = keys[0]; save.period(); }
  showErrors(errors);
  if (added.length) toast(`Загружено: ${added.join('; ')}. Все показатели пересчитаны.`, 'ok');
  recomputeAll();
}

/** Спрашивает пользователя, что делать, если новый файл перекрывает уже загруженный. */
async function resolveConflict(ds) {
  const same = S.datasets.filter(d => d.type === ds.type);
  const clash = ds.period ? same.filter(d => overlaps(d.period, ds.period))
    : same.filter(d => d.snapshotDate === ds.snapshotDate || ds.type === 'costs');
  if (!clash.length) { S.datasets.push(ds); return 'add'; }
  const what = ds.period ? `за ${isoToRu(ds.period.from)}–${isoToRu(ds.period.to)}` : `на ${isoToRu(ds.snapshotDate)}`;
  const old = clash.map(d => `«${d.fileName}»${d.period ? ' (' + isoToRu(d.period.from) + '–' + isoToRu(d.period.to) + ')' : ''}`).join(', ');
  const choice = await askModal(
    `${TYPE_LABEL[ds.type]} ${what} уже загружен`,
    `Новый файл «${ds.fileName}» пересекается по датам с ${old}.<br><br>
     <b>Заменить</b> — старые данные за этот период удаляются, остаются только данные нового файла.<br>
     <b>Объединить</b> — товары из нового файла обновятся, товары, которых в нём нет, сохранятся из старого (подходит, если один файл — черновая выгрузка, а другой — обновлённая).`,
    [['replace', 'Заменить', 'primary'], ['merge', 'Объединить', ''], ['cancel', 'Не загружать', '']]);
  if (choice === 'replace') { S.datasets = S.datasets.filter(d => !clash.includes(d)); S.datasets.push(ds); }
  if (choice === 'merge') {
    const base = clash[clash.length - 1];
    mergeInto(base, ds);
    S.datasets = S.datasets.filter(d => d === base || !clash.includes(d));
  }
  return choice;
}
/** Объединение: новые значения по SKU перекрывают старые, остальные сохраняются. */
function mergeInto(base, ds) {
  if (ds.type === 'ads') {
    const key = c => `${c.camp}|${c.sku}|${c.tool}`;
    const map = new Map(base.data.campaigns.map(c => [key(c), c]));
    ds.data.campaigns.forEach(c => map.set(key(c), c));
    base.data.campaigns = [...map.values()];
  } else {
    base.data.items = { ...(base.data.items || {}), ...(ds.data.items || {}) };
    if (ds.data.unassigned) base.data.unassigned = ds.data.unassigned;
  }
  base.data.cost = { ...(base.data.cost || {}), ...(ds.data.cost || {}) };
  if (ds.data.byArticle) base.data.byArticle = { ...(base.data.byArticle || {}), ...ds.data.byArticle };
  if (base.period && ds.period) base.period = { from: base.period.from < ds.period.from ? base.period.from : ds.period.from, to: base.period.to > ds.period.to ? base.period.to : ds.period.to };
  if (ds.snapshotDate) base.snapshotDate = ds.snapshotDate;
  base.fileName = `${base.fileName} + ${ds.fileName}`;
  base.loadedAt = ds.loadedAt;
  base.warnings = [...new Set([...(base.warnings || []), ...(ds.warnings || [])])];
}

/* =====================================================================
   5. РАСЧЁТ МЕТРИК
   buildModel(ключ периода) собирает все отчёты за период в одну модель по SKU.
   ===================================================================== */
/** Месяцы, за которые есть периодические отчёты (реализация, реклама, начисления). */
function periodKeys() {
  const set = new Set();
  for (const d of S.datasets) if (d.period) {
    let k = d.period.from.slice(0, 7); const end = d.period.to.slice(0, 7);
    for (let guard = 0; k <= end && guard < 60; guard++) { set.add(k); const [y, m] = k.split('-').map(Number); k = m === 12 ? `${y + 1}-01` : `${y}-${pad(m + 1)}`; }
  }
  return [...set].sort();
}
function datasetsFor(type, pk) {
  const ds = S.datasets.filter(d => d.type === type);
  if (pk === 'all') return ds;
  const range = { from: monthStart(pk), to: monthEnd(pk) };
  return ds.filter(d => overlaps(d.period, range));
}
function latestOf(type) {
  return S.datasets.filter(d => d.type === type).sort((a, b) => ((b.snapshotDate || '') + b.loadedAt).localeCompare((a.snapshotDate || '') + a.loadedAt))[0] || null;
}
/** Покрытие датами: объединение интервалов отчётов (в пределах месяца, если выбран месяц). */
function coverage(dss, pk) {
  let iv = dss.map(d => ({ ...d.period }));
  if (pk !== 'all') iv = iv.map(p => ({ from: p.from < monthStart(pk) ? monthStart(pk) : p.from, to: p.to > monthEnd(pk) ? monthEnd(pk) : p.to }));
  iv.sort((a, b) => a.from.localeCompare(b.from));
  const merged = [];
  for (const p of iv) { const last = merged[merged.length - 1]; if (last && p.from <= addDays(last.to, 1)) { if (p.to > last.to) last.to = p.to; } else merged.push({ ...p }); }
  if (!merged.length) return null;
  return { from: merged[0].from, to: merged[merged.length - 1].to, days: sum(merged, p => daysIncl(p.from, p.to)) };
}
/** Категория: вручную заданная или первое существительное названия («Массажная щетка …» → «Щетка»). */
function autoCategory(name) {
  const seg = String(name || '').split('/')[0].replace(/[^\p{L}\s-]/gu, ' ').trim().split(/\s+/).filter(Boolean);
  const w = seg.find(x => !/(ая|яя|ый|ий|ой|ое|ее|ые|ие)$/i.test(x) && x.length > 2) || seg[0] || 'Без категории';
  return w[0].toUpperCase() + w.slice(1).toLowerCase();
}
const categoryOf = s => S.categories[s.sku] || autoCategory(s.name);

/**
 * Источник себестоимости по SKU:
 *   1) введена вручную (приоритет — пользователь мог уточнить значение из отчёта);
 *   2) найдена в любом загруженном отчёте (берём самый свежий);
 *   3) нет данных.
 */
function reportCosts() {
  const res = {};
  const sorted = [...S.datasets].sort((a, b) => a.loadedAt.localeCompare(b.loadedAt));
  const articleMap = {};
  for (const d of S.datasets) for (const it of Object.values(d.data.items || {})) if (it.article) articleMap[it.article] = it.sku;
  for (const d of sorted) {
    for (const [sku, v] of Object.entries(d.data.cost || {})) res[sku] = { v, file: d.fileName };
    for (const [art, v] of Object.entries(d.data.byArticle || {})) if (articleMap[art]) res[articleMap[art]] = { v, file: d.fileName };
  }
  return res;
}
function resolveCost(sku, rc) {
  const m = S.costs[sku];
  if (m && ok(m.v)) return { v: m.v, src: 'manual', report: rc[sku]?.v ?? null };
  if (rc[sku]) return { v: rc[sku].v, src: 'report', file: rc[sku].file, report: rc[sku].v };
  return { v: null, src: 'none', report: null };
}

function newSku(sku) {
  return {
    sku: +sku, name: '', article: '', category: '',
    soldQty: 0, retQty: 0, soldAmt: 0, soldLoyal: 0, retAmt: 0, retLoyal: 0, inReal: false,
    ads: { direct: 0, shared: 0, total: 0, impr: 0, clicks: 0, carts: 0, orders: 0, sales: 0, campaigns: 0 },
    accr: null
  };
}

function buildModel(pk) {
  const M = { pk, skus: [], byId: {}, notes: [] };
  const real = datasetsFor('realization', pk), ads = datasetsFor('ads', pk), acc = datasetsFor('accruals', pk);
  const stockDs = latestOf('stock'), pricesDs = latestOf('prices');
  M.have = { real: real.length > 0, ads: ads.length > 0, acc: acc.length > 0, stock: !!stockDs, prices: !!pricesDs, any: S.datasets.length > 0 };
  M.range = coverage(acc.some(d => d.data.hasSales) ? acc.filter(d => d.data.hasSales) : real.length ? real : ads.length ? ads : acc, pk);
  M.stockDate = stockDs?.snapshotDate || null;

  const get = sku => M.byId[sku] ||= newSku(sku);

  // --- продажи и возвраты ---
  // Главный источник — отчёт по начислениям (там выручка по цене продавца вместе с баллами за скидки
  // и все удержания Ozon за те же операции). Отчёт о реализации используется, только если начислений
  // с продажами за период нет.
  const accSales = acc.filter(d => d.data.hasSales);
  M.salesSrc = accSales.length ? 'accruals' : real.length ? 'realization' : null;
  M.have.sales = !!M.salesSrc;
  const SK = ['soldQty', 'retQty', 'soldAmt', 'soldLoyal', 'retAmt', 'retLoyal'];
  if (M.salesSrc === 'accruals') {
    for (const d of accSales) for (const it of Object.values(d.data.items)) {
      const s = get(it.sku); s.name ||= it.name; s.article ||= it.article;
      if (it.sold.soldQty || it.sold.retQty || it.sold.soldAmt) s.inReal = true;
      for (const k of SK) s[k] += it.sold[k];
    }
    if (real.length) {   // сверка: почему выручка отличается от отчёта о реализации
      const rNet = sum(real.flatMap(d => Object.values(d.data.items)), it => it.soldAmt + it.soldLoyal - it.retAmt - it.retLoyal);
      const aNet = sum(Object.values(M.byId), s => s.soldAmt + s.soldLoyal - s.retAmt - s.retLoyal);
      if (Math.abs(aNet - rNet) > 1) M.notes.push(`Выручка взята из отчёта по начислениям: ${rub(aNet)}. В отчёте о реализации за тот же период ${rub(rNet)} — разница в основном из-за баллов за скидки, которые Ozon доплачивает за покупателя: в отчёте о реализации их нет. Отчёт о реализации можно удалить.`);
    }
  } else {
    for (const d of real) for (const it of Object.values(d.data.items)) {
      const s = get(it.sku); s.inReal = true; s.name ||= it.name; s.article ||= it.article;
      for (const k of SK) s[k] += it[k];
    }
  }
  // --- реклама: прямые расходы по SKU и общие кампании «на все товары» ---
  M.campaigns = []; M.adsCat = { spend: 0, sales: 0, impr: 0, clicks: 0, carts: 0, orders: 0 }; M.sharedAds = 0;
  M.adsHasCarts = ads.some(d => d.data.hasCarts);
  M.adsSpendOnly = ads.length > 0 && ads.every(d => d.data.spendOnly);   // реклама из начислений: только расход
  for (const d of ads) for (const c of d.data.campaigns) {
    M.campaigns.push(c);
    for (const k of Object.keys(M.adsCat)) M.adsCat[k] += c[k] || 0;
    if (c.sku) { const s = get(c.sku); s.name ||= c.name; const a = s.ads; a.direct += c.spend; a.impr += c.impr; a.clicks += c.clicks; a.carts += c.carts; a.orders += c.orders; a.sales += c.sales; a.campaigns++; }

  let accUnassigned = blankFees(); M.adsSubscription = 0; M.adsFromAcc = 0;
  for (const d of acc) {
    for (const it of Object.values(d.data.items)) {
      const s = get(it.sku); s.name ||= it.name; s.article ||= it.article;
      s.accr ||= blankFees(); for (const k in it.fees) s.accr[k] += it.fees[k];
    }
    for (const k in d.data.unassigned) accUnassigned[k] += d.data.unassigned[k];
    // Подписка Premium не привязана к товарам и не видна в аналитике продвижения — делим её на все товары
    M.adsSubscription += d.data.adsSub || 0;
    // Оплата за клик/заказ: если загружена аналитика продвижения, берём расходы по SKU оттуда (не задваиваем);
    // если нет — списания из начислений делим на все товары пропорционально выручке
    if (!ads.length) M.adsFromAcc += sum(Object.values(d.data.adsByCamp || {}), v => v) + (d.data.adsOther || 0);
  }

  // --- остатки и карточки: добавляем товары, которых не было в продажах ---
  const stockItems = stockDs?.data.items || {}, priceItems = pricesDs?.data.items || {};
  for (const it of Object.values(stockItems)) { const s = get(it.sku); s.name ||= it.name; s.article ||= it.article; }
  for (const it of Object.values(priceItems)) { const s = get(it.sku); s.name ||= it.name; s.article ||= it.article; }

  const rc = reportCosts(), R = S.settings.rates;
  const taxRate = ok(R.tax) ? R.tax / 100 : null;
  M.taxSet = taxRate != null; M.ratesSet = !!R.configured;
  const all = Object.values(M.byId);
  const totalNet = sum(all, s => Math.max(0, s.soldAmt + s.soldLoyal - s.retAmt - s.retLoyal));
  const accNet = sum(all.filter(s => s.accr), s => Math.max(0, s.soldAmt + s.soldLoyal - s.retAmt - s.retLoyal));

  for (const s of all) {
    s.category = categoryOf(s);
    // Выручка: реализовано + выплаты по лояльности − возвраты
    s.gross = s.soldAmt + s.soldLoyal;
    s.returns = s.retAmt + s.retLoyal;
    s.net = s.gross - s.returns;
    s.netQty = s.soldQty - s.retQty;
    s.avgPrice = s.soldQty ? s.gross / s.soldQty : (priceItems[s.sku]?.buyerPrice ?? null);
    // Себестоимость
    s.cost = resolveCost(s.sku, rc);
    s.cogs = s.cost.v != null ? s.cost.v * s.netQty : null;
    // Реклама: прямая + доля общих кампаний пропорционально выручке
    s.ads.shared = totalNet > 0 ? M.sharedAds * Math.max(0, s.net) / totalNet : 0;
    // Удержания площадки: из отчёта по начислениям, иначе по заданным ставкам
    const f = blankFees();
    if (s.accr) {
      Object.assign(f, s.accr);
      if (accNet > 0) { const share = Math.max(0, s.net) / accNet; for (const k of ['commission', 'acquiring', 'logistics', 'storage', 'penalties', 'other']) f[k] += accUnassigned[k] * share; }
      if (M.have.ads) f.ads = 0;   // реклама по SKU берётся из отчёта по продвижению — не задваиваем
      s.feeSrc = 'report';
    } else if (R.configured) {
      const commPct = ok(S.settings.catCommission[s.category]) ? S.settings.catCommission[s.category] : R.commission;
      f.commission = s.net * (commPct || 0) / 100;
      f.acquiring = s.net * (R.acquiring || 0) / 100;
      f.logistics = s.soldQty * (R.logistics || 0);
      f.storage = s.soldQty * (R.storage || 0);
      f.other = s.soldQty * (R.other || 0);

    s.ads.total = s.ads.direct + s.ads.shared + (f.ads || 0);
    // Налог — от суммы реализации: «Продажи → Выручка» минус «Возврат выручки» (в отчёте о реализации это
    // «Реализовано на сумму»). Баллы за скидки и программы партнёров в налоговую базу не входят.
    s.taxBase = Math.max(0, s.soldAmt - s.retAmt);
    s.tax = taxRate != null ? s.taxBase * taxRate : 0;
    s.feesTotal = f.commission + f.acquiring + f.logistics + f.storage + f.penalties + f.other;
    // Прибыль считается только когда известны и себестоимость, и удержания
    s.hasSales = s.soldQty > 0;
    s.profitKnown = s.hasSales && s.cost.v != null && s.feeSrc !== 'none';
    s.reason = !s.hasSales ? 'нет продаж в периоде' : s.cost.v == null ? 'нет данных о себестоимости' : s.feeSrc === 'none' ? 'нет данных об удержаниях Ozon' : '';
    if (s.profitKnown) {
      s.profit = s.net - s.cogs - s.feesTotal - s.ads.total - s.tax;
      s.margin = s.net > 0 ? s.profit / s.net : null;
      s.roi = s.cogs > 0 ? s.profit / s.cogs : null;

  abc(all.filter(s => s.profitKnown), s => s.profit, 'abcProfit');
  abc(all.filter(s => s.hasSales), s => s.net, 'abcRevenue');

  M.stock = computeStock(M, stockItems);
  M.totals = totalsOf(M.skus.filter(s => s.inReal || s.ads.total > 0));
  M.cats = categoriesOf(M.skus);
  M.growth = computeGrowth(M);
  if (M.sharedAds > 0 && totalNet <= 0) M.notes.push('Расход кампаний «на все товары» не распределён: нет выручки за период.');
  return M;
}

/* ---------- Остатки: скорость продаж, дни до обнуления, рекомендация ---------- */
function computeStock(M, items) {
  const { stockCrit: crit, stockWarn: warn } = S.settings;
  const days = M.range?.days || null;
  const res = [];
  for (const s of Object.values(M.byId)) {
    const it = items[s.sku];
    if (!it) { s.stock = null; continue; }
    let vel = null, velSrc = '';
    if (ok(it.avgDaily)) { vel = it.avgDaily; velSrc = 'Ozon, 28 дней'; }
    else if (days && s.netQty > 0) { vel = s.netQty / days; velSrc = 'по продажам за период'; }
    let d = null;
    if (vel > 0) d = ok(it.daysLeft) && velSrc.startsWith('Ozon') ? it.daysLeft : Math.floor(it.available / vel);
    const status = vel == null ? 'unknown' : vel <= 0 ? 'nosales' : d < crit ? 'crit' : d < warn ? 'warn' : 'ok';
    s.stock = { ...it, vel, velSrc, days: d, status, runOut: d != null && M.stockDate ? addDays(M.stockDate, d) : null };
    s.stock.advice = supplyAdvice(s);

}
function supplyAdvice(s) {
  const st = s.stock, T = S.settings.supplyDays;

  if (st.vel <= 0) return st.available > 0 ? { text: 'Продаж нет — поставка не нужна', level: 'gray' } : { text: 'Нет ни остатка, ни продаж', level: 'gray' };
  const need = Math.max(0, Math.ceil(st.vel * T - st.available - st.inbound));
  const grp = s.abcProfit || s.abcRevenue;
  if (st.days < S.settings.stockWarn) {
    if (grp === 'C') return { text: `Остатка мало, но товар в группе C${s.abcProfit ? ' по прибыли' : ' по выручке'} — пополняйте, только если он нужен в ассортименте (${need} шт на ${T} дн.)`, level: 'warn' };
    if (need === 0) return { text: `Остатка мало, но поставки в пути (${st.inbound} шт) покрывают ${T} дн. продаж`, level: 'acc' };
    return { text: `Пора поставлять: около ${need} шт на ${T} дн. продаж${st.inbound ? ` (с учётом ${st.inbound} шт в пути)` : ''}`, level: 'neg' };
  }
  if (st.days > 60) return { text: 'Запаса больше чем на 60 дней — новая поставка не нужна', level: 'gray' };

}

/* ---------- Воронка и точки роста (отклонение от медианы каталога) ----------
   Используются данные рекламного отчёта за период: показы → клики → корзина → заказы,
   и выкуп из отчёта о реализации. Потенциал = недополученные единицы × прибыль на единицу. */

  G.med.i2o = median(withAds.map(i2o));

    const u = Math.max(0, units || 0);

  };
  if (G.enough) {
    for (const s of withAds) {
      if (G.med.i2c && i2c(s) < 0.75 * G.med.i2c && good(s))
        add(s, 'card', 'Слабая карточка', `В корзину добавляют ${pct(i2c(s), 2)} показов против медианы ${pct(G.med.i2c, 2)}. Проверьте фото, цену и первые строки описания.`,
          s.ads.impr * (G.med.i2c - i2c(s)) * (c2o(s) ?? G.med.c2o ?? 0));
      if (G.med.impr && s.ads.impr < 0.5 * G.med.impr && good(s))
        add(s, 'reach', 'Мало показов', `${num(s.ads.impr)} показов против медианы ${num(G.med.impr)} при хорошей марже — товару не хватает продвижения.`,
          (G.med.impr - s.ads.impr) * i2o(s));
      if (G.med.c2o && s.ads.carts >= 10 && c2o(s) < 0.75 * G.med.c2o && s.profitKnown)
        add(s, 'cart', 'Бросают корзину', `Из корзины заказывают ${pct(c2o(s))} против медианы ${pct(G.med.c2o)}. Частые причины: срок доставки, цена у конкурентов, отзывы.`,
          s.ads.carts * (G.med.c2o - c2o(s)));
    }
    // Товары с продажами и хорошей маржой, но без рекламы
    for (const s of M.skus) if (s.hasSales && s.ads.impr === 0 && good(s) && G.med.impr && G.med.i2o)
      add(s, 'reach', 'Не продвигается', `У товара хорошая маржа, но в периоде не было рекламных показов. Оценка — по медианным показам и конверсии каталога.`, G.med.impr * G.med.i2o);
  }
  if (G.med.buyout != null) for (const s of M.skus) if (s.soldQty >= 5 && s.buyout < G.med.buyout - 0.05 && s.profitKnown)
    add(s, 'buyout', 'Низкий выкуп', `Выкупают ${pct(s.buyout)} против медианы ${pct(G.med.buyout)}. Проверьте отзывы о размере и соответствии описанию.`, s.soldQty * (G.med.buyout - s.buyout));

}

/* ---------- Автоматические выводы для вкладки «Обзор» ---------- */
